[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcars"
version = "0.1.0"
description = "GraphQL server + database for Starfleet — replaces Trakt, sits alongside AniList/MAL. See SCOPE.md."
requires-python = ">=3.12"
dependencies = [
    # Schema-first GraphQL, hand-written SDL wired to resolvers — SCOPE.md §11.1.
    "ariadne>=0.23",
    # ASGI server to run the Ariadne app; async matches aniq's own httpx-based
    # convention (CLAUDE.md, aniq repo) for the outbound Sonarr/AniList/MAL calls
    # LCARS grows in Phase B.
    "uvicorn[standard]>=0.30",
    # Schema migrations against SQLite — SCOPE.md §11.2. Raw SQL migrations,
    # no ORM (resolved 2026-08-08, §11.2) — hand-written, not autogenerated.
    "alembic>=1.13",
    # Short, type-prefixed, human-readable ids with a custom Crockford-style
    # alphabet — SCOPE.md §5.0/§11.4.
    "nanoid>=2.0",
]

[project.scripts]
lcars = "lcars.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Hand-written SQL DDL (§11.2) — column-aligned CHECK/enum lists read far
# better unwrapped than reflowed to 100 cols. Same reasoning aniq itself
# used for a verbatim-fixture test file, just applied to migrations here.
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
