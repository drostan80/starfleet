[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcars"
version = "0.1.0"
description = "GraphQL server + database for Starfleet — replaces Trakt, sits alongside AniList/MAL. See SCOPE.md."
requires-python = ">=3.12"
dependencies = [
    # Schema-first GraphQL, hand-written SDL wired to resolvers — SCOPE.md §11.1.
    "ariadne>=0.23",
    # ASGI server to run the Ariadne app; async matches aniq's own httpx-based
    # convention (CLAUDE.md, aniq repo) for the outbound Sonarr/AniList/MAL calls
    # LCARS grows in Phase B.
    "uvicorn[standard]>=0.30",
    # Schema migrations against SQLite — SCOPE.md §11.2. Raw SQL migrations,
    # no ORM (resolved 2026-08-08, §11.2) — hand-written, not autogenerated.
    "alembic>=1.13",
    # Short, type-prefixed, human-readable ids with a custom Crockford-style
    # alphabet — SCOPE.md §5.0/§11.4.
    "nanoid>=2.0",
    # server.py (A.3) imports starlette.requests/responses/types directly for
    # the bearer-token middleware + GraphQL context — already an ariadne.asgi
    # transitive dependency, declared explicitly here too since our own code
    # imports it directly, not just relies on it coming along by accident.
    "starlette>=0.37",
    # fribb.py (A.4, §5.5) downloads the Fribb/anime-lists dataset with a
    # sync httpx.Client (matches §11.2's sync-resolver execution model) —
    # promoted here from a dev-only test dependency, 2026-08-08, now that
    # runtime code (not just tests/test_server.py's ASGI transport) needs it.
    "httpx>=0.27",
    # Web UI login gate — password hashing for the web_user table.
    "bcrypt>=4.0",
]

[project.scripts]
lcars = "lcars.cli:main"
# Ops (§1 naming table, §4 Phase B, B.1) — a separate deployable, sharing
# this package/image but with no dependency on lcars's own code (SCOPE.md
# §11.2's B.1 note: it holds no database connection, drives LCARS purely
# over GraphQL like any other client).
ops = "ops.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # httpx itself moved to core dependencies above (A.4) — still used here
    # too, for server.py (A.3)'s ASGI test client (httpx.ASGITransport).
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# schema.graphql (A.2, §11.1) is hand-written SDL loaded at runtime, not a
# .py file — setuptools doesn't ship non-Python files by default, so a real
# `pip install .` (as opposed to `-e .`) would silently omit it without this.
lcars = ["schema.graphql"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# RUF100 added 2026-08-09 (consolidation audit): 22 stale `# noqa`
# directives for non-enabled rules had accumulated unnoticed. Keeping
# the rule on means suppressions stay honest rather than being swept
# once and drifting again.
select = ["E", "F", "I", "UP", "B", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Hand-written SQL DDL (§11.2) — column-aligned CHECK/enum lists read far
# better unwrapped than reflowed to 100 cols. Same reasoning aniq itself
# used for a verbatim-fixture test file, just applied to migrations here.
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
