server {
    listen 80;
    absolute_redirect off;

    # ── Auth subrequest (nginx auth_request) ─────────────────────
    # Every protected location below delegates authentication to LCARS
    # via a lightweight GET /auth/check — returns 200 (valid session
    # cookie) or 401 (expired/missing). The subrequest is internal-only;
    # external callers can't hit it directly.
    location = /_auth_check {
        internal;
        proxy_pass http://lcars:8000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # ── Unprotected: login page + its assets ─────────────────────
    location = /ui/login.html { alias /ui/login.html; }
    location /ui/css/          { alias /ui/css/; }
    location = /ui/favicon.svg { alias /ui/favicon.svg; }

    # ── Unprotected: auth API endpoints ──────────────────────────
    location /auth/ {
        proxy_pass http://lcars:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Unprotected: webhooks (their own secret-header auth) ─────
    location /webhooks/ {
        proxy_pass http://lcars:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Protected: web client static files ───────────────────────
    location /ui/ {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;
        alias /ui/;
        try_files $uri $uri/ /ui/index.html;
    }

    # ── Media files for local mpv playback ──────────────────────
    # No auth gate — mpv (launched by the local helper daemon) has no
    # browser cookie, and the helper runs on a different machine so it
    # can't carry one.  LAN-only exposure is acceptable: the server is
    # already plain HTTP, and /download/ keeps its own cookie gate for
    # browser-initiated saves.
    location /files/ {
        alias /data/;
        add_header Accept-Ranges bytes;
    }

    # ── Protected: media file download (Content-Disposition) ─────
    # Browser-native download — survives tab close, supports resume
    # via Accept-Ranges.  Hard 401 (no redirect) so an expired
    # session never writes the login page to disk under a .mkv name.
    location /download/ {
        auth_request /_auth_check;
        error_page 401 = @download_auth_fail;
        alias /data/;
        add_header Content-Disposition 'attachment';
        add_header Accept-Ranges bytes;
    }

    # ── Protected: GraphQL proxy ─────────────────────────────────
    location / {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;
        proxy_pass http://lcars:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 401 handler — redirect browsers to login ─────────────────
    location @login_redirect {
        return 302 /ui/login.html?next=$request_uri;
    }

    # ── 401 handler for downloads — hard 401, no redirect ────────
    # A redirect would silently write the login page to disk under
    # the media filename, corrupting the download.
    location @download_auth_fail {
        default_type application/json;
        return 401 '{"error":"session_expired"}';
    }
}
