# A0 (Android app plan) — WebSocket passthrough for graphql-transport-ws
# (A3): Connection must be "upgrade" only on an actual upgrade request and
# "close" otherwise, never hard-coded — every plain GraphQL POST through
# `location /` would otherwise carry `Connection: upgrade` with no
# `Upgrade` header, an asymmetric pair a plain HTTP/1.1 backend can choke
# on. This file lands at /etc/nginx/conf.d/default.conf (Dockerfile),
# included inside the base image's own http{} block, so a bare `map` here
# is valid.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    absolute_redirect off;

    # ── Auth subrequest (nginx auth_request) ─────────────────────
    # Every protected location below delegates authentication to LCARS
    # via a lightweight GET /auth/check — returns 200 (valid session
    # cookie) or 401 (expired/missing). The subrequest is internal-only;
    # external callers can't hit it directly.
    location = /_auth_check {
        internal;
        proxy_pass http://lcars:8000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        # A0 (Android app plan) — native code authenticates with bearer only,
        # no cookie; forward it so LCARS's own bearer check in /auth/check
        # sees it.
        proxy_set_header Authorization $http_authorization;
    }

    # ── Unprotected: login page + its assets ─────────────────────
    location = /ui/login.html { alias /ui/login.html; }
    location /ui/css/          {
        alias /ui/css/;
        # 2026-09-22 — real, repeatedly-reported bug: this location's
        # own prefix (/ui/css/) is more specific than the protected
        # /ui/ block below, so nginx matches THIS one for every CSS
        # request site-wide (not just login.html's) and its own lack of
        # a Cache-Control header let browsers apply their own long-lived
        # heuristic caching to main.css — unlike JS/HTML under /ui/,
        # which correctly revalidate via Cache-Control: no-cache on
        # every load. A CSS-only content change (e.g. b6a70a0 adding
        # --svc-anidb/--svc-syoboi/--svc-tvmaze without a cache-bust
        # version bump) could then stay invisible to already-cached
        # browsers indefinitely, only fixed by a hard refresh —
        # confirmed live: service badge icons rendering blank/white
        # until then. Matches the general /ui/ block's own policy now.
        add_header Cache-Control "no-cache";
    }
    location = /ui/favicon.svg { alias /ui/favicon.svg; }

    # ── Unprotected: auth API endpoints ──────────────────────────
    location /auth/ {
        proxy_pass http://lcars:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Unprotected: webhooks (their own secret-header auth) ─────
    location /webhooks/ {
        proxy_pass http://lcars:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Protected: web client static files ───────────────────────
    location /ui/ {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;
        alias /ui/;
        try_files $uri $uri/ /ui/index.html;
        add_header Cache-Control "no-cache";
    }

    # ── Media files for local mpv playback ──────────────────────
    # No auth gate — mpv (launched by the local helper daemon) has no
    # browser cookie, and the helper runs on a different machine so it
    # can't carry one.  LAN-only exposure is acceptable: the server is
    # already plain HTTP, and /download/ keeps its own cookie gate for
    # browser-initiated saves.
    location /files/ {
        alias /data/;
        add_header Accept-Ranges bytes;
    }

    # ── Protected: media file download (Content-Disposition) ─────
    # Browser-native download — survives tab close, supports resume
    # via Accept-Ranges.  Hard 401 (no redirect) so an expired
    # session never writes the login page to disk under a .mkv name.
    location /download/ {
        auth_request /_auth_check;
        error_page 401 = @download_auth_fail;
        alias /data/;
        add_header Content-Disposition 'attachment';
        add_header Accept-Ranges bytes;
    }

    # ── Protected: GraphQL proxy (HTTP + WebSocket) ───────────────
    # A0 — WebSocket passthrough for graphql-transport-ws subscriptions
    # (A3 plan): Upgrade/Connection headers plus a long read timeout so a
    # long-lived subscription connection isn't cut at nginx's 60s default.
    location / {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;
        proxy_pass http://lcars:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ── 401 handler — redirect browsers to login ─────────────────
    location @login_redirect {
        return 302 /ui/login.html?next=$request_uri;
    }

    # ── 401 handler for downloads — hard 401, no redirect ────────
    # A redirect would silently write the login page to disk under
    # the media filename, corrupting the download.
    location @download_auth_fail {
        default_type application/json;
        return 401 '{"error":"session_expired"}';
    }
}
