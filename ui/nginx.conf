server {
    listen 80;

    # Serve the web client static files
    location /ui/ {
        alias /ui/;
        try_files $uri $uri/ /ui/index.html;
    }

    # Serve raw media files for local mpv playback.
    location /files/ {
        alias /data/;
        add_header Accept-Ranges bytes;
    }

    # GraphQL at /. All methods proxied straight to LCARS —
    # no if-directive, which is a known nginx anti-pattern that can
    # swallow POST bodies before the upstream ever sees them.
    location / {
        proxy_pass http://lcars:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
