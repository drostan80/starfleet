<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEST SHUTTLE — Calendar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Poster art hosts — opens the connection before the first <img> is parsed -->
  <link rel="preconnect" href="https://artworks.thetvdb.com">
  <link rel="preconnect" href="https://s4.anilist.co">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/main.css?v=15">
</head>
<body>

<!-- ── Top nav ─────────────────────────────────────────── -->
<nav class="top-nav">
  <a href="index.html" class="nav-brand">TEST SHUTTLE</a>
  <ul class="nav-links">
    <li><a href="index.html" class="active">Calendar</a></li>
    <li><a href="backlog.html">Backlog</a></li>
    <li><a href="list.html">List</a></li>
    <li><a href="grabs.html">Grabs</a></li>
    <li><a href="add.html">Add</a></li>
    <li><a href="reviews.html" data-nav="reviews">Reviews</a></li>
  </ul>
  <div class="nav-spacer"></div>
  <div class="status-filter" id="status-filter">
    <span class="status-filter-label">Show:</span>
    <button class="sf-pill active" data-status="WATCHING" style="--pill-color:var(--st-watching)">
      <span class="sf-dot" style="background:var(--st-watching)"></span>Watching
    </button>
    <button class="sf-pill active" data-status="COMPLETED" style="--pill-color:var(--st-completed)">
      <span class="sf-dot" style="background:var(--st-completed)"></span>Completed
    </button>
    <button class="sf-pill active" data-status="PLANNED" style="--pill-color:var(--st-planning)">
      <span class="sf-dot" style="background:var(--st-planning)"></span>Planned
    </button>
    <button class="sf-pill active" data-status="PAUSED" style="--pill-color:var(--st-paused)">
      <span class="sf-dot" style="background:var(--st-paused)"></span>Paused
    </button>
    <button class="sf-pill active" data-status="DROPPED" style="--pill-color:var(--st-dropped)">
      <span class="sf-dot" style="background:var(--st-dropped)"></span>Dropped
    </button>
  </div>
    <a href="downloads.html" class="nav-icon-btn" title="Downloads">DL</a>
  <button class="nav-search-btn" id="nav-search-btn" title="Search  /"><span>⌕</span></button>
  <a href="settings.html" class="nav-icon-btn" title="Settings">⚙</a>
</nav>

<!-- ── Status banner (loading / error) ─────────────────── -->
<div id="status-banner" class="status-banner hidden"></div>

<!-- ── View controls ───────────────────────────────────── -->
<div class="view-controls">
  <div class="view-modes">
    <button class="view-mode" data-mode="today">Today</button>
    <button class="view-mode" data-mode="1d">1D</button>
    <button class="view-mode active" data-mode="3d">3D</button>
    <button class="view-mode" data-mode="week">Week</button>
  </div>
  <button class="view-mode layout-toggle" id="planner-btn" title="Planner view">▥</button>
  <div class="ctrl-sep"></div>
  <div class="date-nav">
    <button class="date-btn" id="prev-period-btn" title="Previous period">«</button>
    <button class="date-btn" id="prev-day-btn" title="Previous day">‹</button>
    <span class="date-range-label" id="date-range-label">—</span>
    <button class="date-btn" id="next-day-btn" title="Next day">›</button>
    <button class="date-btn" id="next-period-btn" title="Next period">»</button>
  </div>
  <button class="today-btn" id="today-btn">Today</button>
</div>

<!-- ── Calendar ─────────────────────────────────────────── -->
<div class="calendar" id="calendar"></div>

<script type="module">
  import { init } from './js/calendar.js?v=28';
  import { initSearch } from './js/search.js?v=2';
  await init();
  initSearch();
</script>

</body>
</html>
