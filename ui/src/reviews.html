<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STARFLEET — Reviews</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/main.css?v=16">
  <style>
    /* ── Reviews page ────────────────────────────────────────── */
    .reviews-controls {
      height: var(--ctrl-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 14px;
      flex-shrink: 0;
      position: sticky;
      top: var(--nav-h);
      z-index: 95;
    }

    .reviews-count {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .reviews-count .cnt-open { color: var(--st-planning); font-weight: 500; }

    .filter-pills {
      display: flex;
      gap: 4px;
      margin-left: 8px;
    }
    .filter-pill {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.12s;
      user-select: none;
    }
    .filter-pill:hover { color: var(--text); background: var(--surface-3); }
    .filter-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .toggle-resolved {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
      user-select: none;
    }
    .toggle-resolved input[type=checkbox] {
      accent-color: var(--accent);
      width: 14px; height: 14px;
      cursor: pointer;
    }
    .toggle-resolved:hover { color: var(--text); }

    .refresh-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.12s;
    }
    .refresh-btn:hover { color: var(--text); background: var(--surface-3); }

    /* ── Review list + detail ────────────────────────────────── */
    .reviews-body {
      flex: 1;
      display: flex;
      gap: 0;
      min-height: 0;
    }

    .review-list {
      width: 360px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }

    .review-item {
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
      align-items: flex-start;
    }
    .review-item:hover { background: var(--surface-2); }
    .review-item.selected {
      background: var(--surface-2);
      border-left: 2px solid var(--accent);
      padding-left: 12px;
    }
    .review-item.resolved { opacity: 0.45; }
    .review-item.resolved.selected { opacity: 0.8; }

    .ri-poster {
      width: 32px;
      height: 48px;
      border-radius: 3px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface-3);
    }

    .ri-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

    .ri-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ri-field-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ri-entity-type {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--surface-3);
      color: var(--muted);
      flex-shrink: 0;
    }
    .ri-field {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--accent);
    }
    .ri-resolved-badge {
      font-size: 9px;
      color: var(--st-watching);
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-left: auto;
    }

    .ri-meta {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .ri-source {
      font-size: 10px;
      color: var(--faint);
    }
    .ri-date {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--faint);
      margin-left: auto;
    }

    /* ── Detail pane ─────────────────────────────────────────── */
    .review-detail {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .detail-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
    }

    .detail-header {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .detail-poster {
      width: 60px;
      height: 90px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--surface-3);
      flex-shrink: 0;
    }
    .detail-header-info { flex: 1; min-width: 0; }
    .detail-show-title {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 4px;
    }
    .detail-episode-ctx {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .detail-episode-title {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }

    .detail-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .detail-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 6px 12px;
    }
    .dg-key {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .dg-val {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text);
      word-break: break-all;
    }
    .dg-val.resolved { color: var(--st-watching); }

    /* ── Before/after diff ───────────────────────────────────── */
    .diff-container {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }
    .diff-box {
      flex: 1;
      border-radius: 6px;
      padding: 10px 14px;
      min-height: 48px;
    }
    .diff-box.before {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .diff-box.after {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.25);
    }
    .diff-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .diff-box.before .diff-label { color: var(--st-dropped); }
    .diff-box.after .diff-label { color: var(--st-watching); }
    .diff-value {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text);
      word-break: break-all;
    }
    .diff-arrow {
      display: flex;
      align-items: center;
      color: var(--muted);
      font-size: 18px;
      flex-shrink: 0;
    }

    /* chain (collapsed by default if long) */
    .chain-toggle {
      font-size: 10px;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
      margin-top: 4px;
    }
    .chain-toggle:hover { text-decoration: underline; }
    .chain-items {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 6px;
    }
    .chain-item {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      padding: 3px 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 3px;
    }
    .chain-item:last-child {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Proposed message (for non-value chains) ─────────────── */
    .proposed-message {
      font-size: 12px;
      color: var(--text);
      padding: 10px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      line-height: 1.5;
    }

    /* ── Actions ─────────────────────────────────────────────── */
    .review-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .review-actions .btn-primary {
      font-size: 12px;
      padding: 6px 14px;
    }
    .btn-approve {
      background: var(--st-watching) !important;
      border-color: var(--st-watching) !important;
    }
    .btn-approve:hover { filter: brightness(1.15); }
    .btn-revert {
      background: var(--st-planning) !important;
      border-color: var(--st-planning) !important;
    }
    .btn-revert:hover { filter: brightness(1.15); }
    .btn-retry {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
    }
    .btn-dismiss {
      background: var(--surface-2) !important;
      border: 1px solid var(--border) !important;
      color: var(--muted) !important;
    }
    .btn-dismiss:hover { color: var(--text) !important; background: var(--surface-3) !important; }

    /* Inline edit row */
    .inline-edit {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }
    .inline-edit input {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 5px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
      flex: 1;
      min-width: 0;
    }
    .inline-edit input:focus { border-color: var(--accent); }
    .inline-edit .btn-primary { flex-shrink: 0; }

    .action-note {
      font-size: 10px;
      color: var(--faint);
      font-style: italic;
      margin-top: 2px;
    }
    .action-status {
      font-size: 11px;
      color: var(--muted);
    }
    .action-status.ok { color: var(--st-watching); }
    .action-status.err { color: var(--st-dropped); }

    /* ── Resolve form ────────────────────────────────────────── */
    .resolve-form textarea {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      resize: vertical;
      min-height: 40px;
      outline: none;
      transition: border-color 0.12s;
      width: 100%;
    }
    .resolve-form textarea:focus { border-color: var(--accent); }
    .resolve-form textarea::placeholder { color: var(--faint); }

    /* Resolution display */
    .resolution-box {
      background: rgba(34, 197, 94, 0.06);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 6px;
      padding: 10px 14px;
    }
    .resolution-box .detail-grid { gap: 4px 12px; }

    .reviews-loading {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── Bulk bar ────────────────────────────────────────────── */
    .bulk-bar {
      padding: 6px 20px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .bulk-bar:empty { display: none; }

    /* ── Conflict comparison ─────────────────────────────────── */
    .conflict-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .conflict-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .conflict-card.this-side { border-color: var(--accent); }
    .conflict-card-header {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .conflict-card-poster {
      width: 44px; height: 66px;
      border-radius: 3px;
      object-fit: cover;
      background: var(--surface-3);
      flex-shrink: 0;
    }
    .conflict-card-title {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .conflict-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .conflict-tag {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--surface-3);
      color: var(--muted);
    }
    .conflict-tag.watching { background: rgba(34,197,94,0.15); color: var(--st-watching); }
    .conflict-tag.planned { background: rgba(245,158,11,0.15); color: var(--st-planning); }
    .conflict-tag.tracked { background: rgba(91,140,255,0.15); color: var(--accent); }
    .conflict-tag.untracked { background: rgba(239,68,68,0.1); color: var(--st-dropped); }
    .conflict-ids {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.6;
    }
    .conflict-ids a { color: var(--accent); text-decoration: none; }
    .conflict-ids a:hover { text-decoration: underline; }
    .conflict-ids .contested { color: var(--st-planning); font-weight: 600; }
    .conflict-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--faint);
      margin-bottom: 2px;
    }
    .conflict-actions-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 4px;
    }
    .conflict-loading {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 20px;
    }

    /* ── External IDs section ────────────────────────────────── */
    .ext-ids-grid {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 6px 10px;
      align-items: center;
    }
    .ext-id-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
    }
    .ext-id-value {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text);
    }
    .ext-id-value a { color: var(--accent); text-decoration: none; }
    .ext-id-value a:hover { text-decoration: underline; }
    .ext-id-value.missing { color: var(--st-dropped); font-style: italic; }

    .id-form-grid {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 8px 10px;
      align-items: center;
    }
    .id-form-grid label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }
    .id-form-grid input {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 5px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
      min-width: 0;
    }
    .id-form-grid input:focus { border-color: var(--accent); }
    .id-form-grid input::placeholder { color: var(--faint); }
    .id-form-grid .hint {
      font-size: 10px;
      color: var(--faint);
    }
    .season-rows {
      margin-top: 6px;
    }
    .season-row-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--faint);
      grid-column: 1 / -1;
      margin-top: 4px;
      border-top: 1px solid var(--border);
      padding-top: 6px;
    }
  </style>
