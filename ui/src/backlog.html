<html lang="en" data-refreshable>
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://s4.anilist.co">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/main.css?v=32">
  <link rel="stylesheet" href="css/cards-v2.css?v=13">
  <style>
    /* ── Backlog card size — 20% larger than calendar default ── */
    #backlog-grid {
      --card-w: 222px;
      --art-h:  306px;
    }

    /* ── Backlog show header — override calendar's giant Syne heading ── */
    .bl-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--border);
    }
    .bl-show-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      /* allow wrapping — long anime titles need room */
      white-space: normal;
      word-break: break-word;
      flex: 1;
    }
    .bl-ep-count {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Group card — collapsed multi-episode show ─────────── */

    .group-card {
      width: var(--card-w);
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .group-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .group-card .group-art {
      width: 100%;
      height: var(--art-h);
      position: relative;
      overflow: hidden;
      background: var(--surface-2);
    }
    .group-card .group-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6);
      transition: filter 0.15s;
    }
    .group-card:hover .group-art img {
      filter: brightness(0.75);
    }
    .group-card .group-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .group-card .group-count {
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      line-height: 1;
    }
    .group-card .group-label {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .group-card .group-footer {
      padding: 8px 10px;
    }
    .group-card .group-title {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .group-card .group-meta {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Expanded group wrapper ──────────────────────────────── */

    .group-expanded {
      width: 100%;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px;
      background: var(--surface);
      flex-basis: 100%;
    }
    .group-expanded-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .group-expanded-header:hover {
      opacity: 0.8;
    }
    .group-expanded-header img {
      width: 36px;
      height: 52px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .group-expanded-info {
      flex: 1;
      min-width: 0;
    }
    .group-expanded-title {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .group-expanded-meta {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }
    .group-expanded-collapse {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.12s;
    }
    .group-expanded-collapse:hover {
      background: var(--surface-3);
      color: var(--text);
    }
    .group-expanded-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
  </style>

<style>

  .ar-play:hover { transform: scale(1.15); color: #fff; }
  .ar-title-link { color: var(--text); font: 500 11.5px/1.25 'DM Sans', sans-serif;
                   text-decoration: none; overflow: hidden; display: -webkit-box;
                   -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  a.ar-title-link:hover { color: var(--accent); }
  .ar-meta { display: flex; justify-content: space-between; gap: 6px;
             font: 500 10px 'DM Mono', monospace; color: var(--muted); white-space: nowrap; }
</style>

<!-- ── Backlog card grid ─────────────────────────────────── -->
<div class="calendar" id="backlog-grid"></div>

<script type="module">
  import { getConfig, bootstrapConfig, applyAppName } from './js/config.js?v=6';
  import { initSearch } from './js/search.js?v=12';
  import { fetchBacklog, fetchRecentGrabs, gql } from './js/api.js?v=34';
  import {
    buildCard,
    showBanner, hideBanner,
    fetchTmdbPoster,
  } from './js/calendar.js?v=66';
  import { buildWatchedToggle } from './js/watched-toggle.js?v=1';

  applyAppName();

  // Watched toggle (disabled — backlog is unwatched-only by definition)
  const wtMount = document.getElementById('watched-toggle-mount');
  if (wtMount) wtMount.appendChild(buildWatchedToggle({ disabled: true }));
  await bootstrapConfig();

  const STATUSES = ['WATCHING','COMPLETED','PLANNED','PAUSED','DROPPED'];
  const STATUS_FILTER_KEY = 'starfleet_status_filter';

  /* ── Status filter ──────────────────────────────────────── */
  let activeStatuses = loadStatusFilter();

  function loadStatusFilter() {
    try {
      const stored = localStorage.getItem(STATUS_FILTER_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed)) return new Set(parsed);
      }
    } catch {}
    return new Set(STATUSES.filter(s => s !== 'DROPPED')); // default: Dropped off
  }

  function saveStatusFilter() {
    try {
      localStorage.setItem(STATUS_FILTER_KEY, JSON.stringify([...activeStatuses]));
    } catch {}
  }

  let _lastEpisodes = [];

  function toggleStatus(status) {
    if (activeStatuses.has(status)) {
      activeStatuses.delete(status);
    } else {
      activeStatuses.add(status);
    }
    saveStatusFilter();
    document.querySelectorAll('.sf-pill').forEach(pill => {
      pill.classList.toggle('active', activeStatuses.has(pill.dataset.status));
    });
    renderGrid(_lastEpisodes, getConfig());
  }

  // Wire up status filter pills
  document.querySelectorAll('.sf-pill').forEach(pill => {
    const status = pill.dataset.status;
    pill.classList.toggle('active', activeStatuses.has(status));
    pill.addEventListener('click', () => toggleStatus(status));
  });

  /* ── Rendering ──────────────────────────────────────────── */

  const GROUP_THRESHOLD = 4; // collapse shows with ≥ this many episodes
  const expandedShows = new Set(); // track which shows are expanded

  function renderGrid(episodes, cfg) {
    const grid = document.getElementById('backlog-grid');
    const countLabel = document.getElementById('backlog-count-label');
    grid.innerHTML = '';

    // Group episodes by show, filter by status
    const byShow = new Map();
    for (const ep of episodes) {
      if (!ep.show.tracked) continue;
      const epStatus = ep.seasonEntity?.status || ep.show.status;
      if (!activeStatuses.has(epStatus)) continue;
      const sid = ep.show.id;
      if (!byShow.has(sid)) byShow.set(sid, { show: ep.show, episodes: [] });
      byShow.get(sid).episodes.push(ep);
    }

    const totalVisible = [...byShow.values()].reduce((n, g) => n + g.episodes.length, 0);
    countLabel.textContent = `${totalVisible} episode${totalVisible !== 1 ? 's' : ''} · ${byShow.size} show${byShow.size !== 1 ? 's' : ''}`;

    if (byShow.size === 0) {
      grid.innerHTML = `<div class="calendar-empty">${
        activeStatuses.size === 0
          ? 'All statuses hidden — enable some in the Show filter.'
          : 'Backlog is empty.'
      }</div>`;
      return;
    }

    // Sort shows: most recent air date first, then alphabetical
    const groups = [...byShow.values()];
    for (const g of groups) {
      g.episodes.sort((a, b) => {
        if (a.season !== b.season) return (a.season ?? 0) - (b.season ?? 0);
        return (a.episode ?? 0) - (b.episode ?? 0);
      });
    }
    groups.sort((a, b) => {
      const aDate = latestAirDate(a.episodes);
      const bDate = latestAirDate(b.episodes);
      if (aDate !== bDate) return bDate.localeCompare(aDate); // most recent first
      return a.show.displayTitle.localeCompare(b.show.displayTitle);
    });

    // Render — shows with many episodes get a group card (collapsed/expanded)
    const row = document.createElement('div');
    row.className = 'card-row';
    row.style.flexWrap = 'wrap';

    for (const group of groups) {
      const isExpanded = expandedShows.has(group.show.id);

      if (group.episodes.length >= GROUP_THRESHOLD && !isExpanded) {
        // Collapsed group card
        row.appendChild(buildGroupCard(group, cfg));
      } else if (group.episodes.length >= GROUP_THRESHOLD && isExpanded) {
        // Expanded group — full-width wrapper with all episode cards
        row.appendChild(buildExpandedGroup(group, cfg));
      } else {
        // Fewer episodes — render individual cards inline
        for (const ep of group.episodes) {
          row.appendChild(buildCard(ep, cfg));
        }
      }
    }

    grid.appendChild(row);

    // Kick off TMDB poster fetches for shows without art
    if (cfg.tmdb_api_key) {
      const seen = new Set();
      for (const ep of episodes) {
        if (!ep.show.posterUrl && !seen.has(ep.show.id)) {
          seen.add(ep.show.id);
          fetchTmdbPoster(ep.show, cfg.tmdb_api_key);
        }
      }
    }
  }

  /** Get the most recent air date from a list of episodes. */
  function latestAirDate(episodes) {
    let latest = '';
    for (const ep of episodes) {
      if (ep.airDateUtc && ep.airDateUtc > latest) latest = ep.airDateUtc;
    }
    return latest || '1970-01-01';
  }

  /** Build a collapsed group card for a show with many backlog episodes. */
  function buildGroupCard(group, cfg) {
    const card = document.createElement('div');
    card.className = 'group-card';

    // Art
    const artDiv = document.createElement('div');
    artDiv.className = 'group-art';
    const posterUrl = group.show.posterUrl;
    if (posterUrl) {
      const img = document.createElement('img');
      img.src = posterUrl;
      img.alt = group.show.displayTitle;
      if (cfg.tmdb_api_key) {
        img.onerror = () => { img.remove(); fetchTmdbPoster(group.show, cfg.tmdb_api_key); };
      }
      artDiv.appendChild(img);
    }

    // Overlay
    const overlay = document.createElement('div');
    overlay.className = 'group-overlay';
    const count = document.createElement('div');
    count.className = 'group-count';
    count.textContent = group.episodes.length;
    overlay.appendChild(count);
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = 'episodes';
    overlay.appendChild(label);
    artDiv.appendChild(overlay);
    card.appendChild(artDiv);

    // Footer
    const footer = document.createElement('div');
    footer.className = 'group-footer';
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = group.show.displayTitle;
    title.title = group.show.displayTitle;
    footer.appendChild(title);

    const meta = document.createElement('div');
    meta.className = 'group-meta';
    const firstEp = group.episodes[0];
    const lastEp = group.episodes[group.episodes.length - 1];
    const range = `S${String(firstEp.season ?? 0).padStart(2, '0')}E${String(firstEp.episode ?? 0).padStart(2, '0')}–E${String(lastEp.episode ?? 0).padStart(2, '0')}`;
    meta.textContent = `${range} · click to expand`;
    footer.appendChild(meta);
    card.appendChild(footer);

    card.addEventListener('click', () => {
      expandedShows.add(group.show.id);
      renderGrid(_lastEpisodes, cfg);
    });

    return card;
  }

  /** Build an expanded group wrapper with all episode cards visible. */
  function buildExpandedGroup(group, cfg) {
    const wrapper = document.createElement('div');
    wrapper.className = 'group-expanded';

    // Header — click to collapse
    const header = document.createElement('div');
    header.className = 'group-expanded-header';

    if (group.show.posterUrl) {
      const img = document.createElement('img');
      img.src = group.show.posterUrl;
      img.alt = '';
      img.onerror = () => { img.style.display = 'none'; };
      header.appendChild(img);
    }

    const info = document.createElement('div');
    info.className = 'group-expanded-info';
    const title = document.createElement('div');
    title.className = 'group-expanded-title';
    title.textContent = group.show.displayTitle;
    info.appendChild(title);
    const meta = document.createElement('div');
    meta.className = 'group-expanded-meta';
    meta.textContent = `${group.episodes.length} episodes in backlog`;
    info.appendChild(meta);
    header.appendChild(info);

    const collapseBtn = document.createElement('button');
    collapseBtn.className = 'group-expanded-collapse';
    collapseBtn.textContent = '▴ Collapse';
    header.appendChild(collapseBtn);

    const collapse = () => {
      expandedShows.delete(group.show.id);
      renderGrid(_lastEpisodes, cfg);
    };
    header.addEventListener('click', collapse);
    wrapper.appendChild(header);

    // Cards
    const cardsDiv = document.createElement('div');
    cardsDiv.className = 'group-expanded-cards';
    for (const ep of group.episodes) {
      cardsDiv.appendChild(buildCard(ep, cfg));
    }
    wrapper.appendChild(cardsDiv);

    return wrapper;
  }

  /* ── Load ────────────────────────────────────────────────── */
  async function load(silent = false) {
    const grid = document.getElementById('backlog-grid');
    const cfg = getConfig();
    if (!silent) {
      grid.innerHTML = '<div class="calendar-empty"><span class="spinner" style="width:18px;height:18px;border-width:2.5px"></span></div>';
      showBanner('Loading backlog…', 'loading');
    }

    try {
      const episodes = await fetchBacklog();
      _lastEpisodes = episodes;
      renderGrid(episodes, cfg);
      if (!silent) hideBanner();
    } catch (err) {
      grid.innerHTML = `<div class="calendar-empty" style="color:var(--st-dropped)">${err.message}</div>`;
      showBanner(`Error: ${err.message}`, 'error');
    }
  }


  /* ── Added recently: the latest grabs from Sonarr and Radarr, in order of the grab ── */
  const AR_LIMIT = 30;   // items shown
  const AR_FETCH = 100;  // grabs read per service, so duplicates dropped and batches grouped still leave 30
  const AR_BATCH_SECONDS = 120;  // grabs of one season this close together are one batch (a season pack)

  function agoText(iso) {
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 60) return `${mins || 1} min ago`;
    const hrs = Math.round(mins / 60);
    if (hrs < 48) return `${hrs} h ago`;
    return `${Math.round(hrs / 24)} d ago`;
  }

  async function loadAddedRecently() {
    const box = document.getElementById('added-recent');
    const strip = document.getElementById('ar-strip');
    try {
      const both = await Promise.allSettled([
        fetchRecentGrabs('sonarr', 1, AR_FETCH), fetchRecentGrabs('radarr', 1, AR_FETCH)]);
      const seen = new Set();
      const grabs = both.flatMap(r => (r.status === 'fulfilled' ? r.value : []))
        .filter(g => g.date)
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        // the same episode / film grabbed more than once: only the latest grab shows
        .filter(g => {
          const key = `${g.service}|${g.showId || g.title}|${g.seasonNumber ?? ''}|${g.episodeNumber ?? ''}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      // a batch (a season pack grabbed in one go) is one card: S01E37–E60
      const batches = [];
      for (const g of grabs) {
        const t = new Date(g.date).getTime();
        const batch = g.episodeNumber == null ? null : batches.find(b =>
          b.service === g.service && b.key === `${g.showId || g.title}|${g.seasonNumber}`
          && Math.abs(b.oldest - t) <= AR_BATCH_SECONDS * 1000);
        if (batch) {
          batch.members.push(g);
          batch.oldest = Math.min(batch.oldest, t);
        } else {
          batches.push({ service: g.service, key: `${g.showId || g.title}|${g.seasonNumber}`,
                         oldest: t, members: [g] });
        }
      }
      const cards = batches.slice(0, AR_LIMIT).map(b => {
        // the card is the newest grab; a batch plays from its first episode
        const eps = b.members.map(m => m.episodeNumber).filter(n => n != null).sort((x, y) => x - y);
        const first = b.members.reduce((a, m) => (m.episodeNumber ?? 1e9) < (a.episodeNumber ?? 1e9) ? m : a);
        return { ...b.members[0], filePath: first.filePath, playEpisode: first.episodeNumber,
                 first: eps[0], last: eps[eps.length - 1], count: eps.length };
      });
      box.hidden = cards.length === 0;
      strip.replaceChildren();
      if (!cards.length) return;

      // posters of the shows LCARS knows (one request)
      const ids = [...new Set(cards.map(g => g.showId).filter(Boolean))];
      const posters = {};
      if (ids.length) {
        try {
          const q = '{ ' + ids.map((id, i) => `s${i}: show(id: ${JSON.stringify(id)}) { id posterUrl }`).join(' ') + ' }';
          const data = await gql(q);
          for (const v of Object.values(data)) if (v) posters[v.id] = v.posterUrl;
        } catch (err) { console.warn('Added recently: posters failed:', err); }
      }

      const cfg = getConfig();
      for (const g of cards) {
        const item = document.createElement('div');
        item.className = 'ar-item';

        const art = document.createElement('div');
        art.className = 'ar-art';
        const poster = g.showId ? posters[g.showId] : null;
        if (poster) {
          const img = document.createElement('img');
          img.src = poster;
          img.alt = g.title;
          img.onerror = () => img.remove();
          art.appendChild(img);
        } else {
          const none = document.createElement('div');
          none.className = 'ar-noart';
          none.textContent = g.title;
          art.appendChild(none);
        }
        const badge = document.createElement('span');
        badge.className = `ar-badge ${g.service}`;
        badge.textContent = g.service === 'radarr' ? 'Radarr' : 'Sonarr';
        art.appendChild(badge);
        if (g.filePath) {
          const play = document.createElement('button');
          play.className = 'ar-play';
          play.title = 'Play in mpv';
          play.textContent = '▶';
          play.addEventListener('click', () => launchMpv(g.filePath, cfg,
            g.showId ? { showId: g.showId, season: g.seasonNumber ?? null, episode: g.playEpisode ?? g.episodeNumber ?? null } : null));
          art.appendChild(play);
        }
        item.appendChild(art);

        const title = document.createElement(g.showId ? 'a' : 'span');
        title.className = 'ar-title-link';
        if (g.showId) title.href = `show.html?id=${encodeURIComponent(g.showId)}`;
        title.textContent = g.title;
        title.title = g.releaseTitle || g.title;
        item.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'ar-meta';
        const pad = n => String(n).padStart(2, '0');
        const ep = (g.seasonNumber != null && g.episodeNumber != null)
          ? (g.count > 1 ? `S${pad(g.seasonNumber)}E${pad(g.first)}–E${pad(g.last)}`
                         : `S${pad(g.seasonNumber)}E${pad(g.episodeNumber)}`) : 'Film';
        const left = document.createElement('span');
        left.textContent = ep;
        const right = document.createElement('span');
        right.textContent = agoText(g.date);
        right.title = new Date(g.date).toLocaleString();
        meta.append(left, right);
        item.appendChild(meta);
        strip.appendChild(item);
      }
    } catch (err) {
      console.warn('Added recently failed to load:', err);
    }
  }

  load();
  loadAddedRecently();
  initSearch();

  // A just-watched episode needs to drop out of this list — see
  // launchMpv() in calendar.js for why the refresh is delayed.
  window.addEventListener('starfleet:refresh-after-watch', () => load(true));
  // every so often, and when the tab comes back into view (auto-refresh.js)
  window.addEventListener('starfleet:auto-refresh', () => { load(true); loadAddedRecently(); });
</script>

</body>
</html>
