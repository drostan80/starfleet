# SCOPE.md §11.3 / BUILD_PLAN.md 0.4 — hybrid trigger:
#   - every push to main: lint + test + a docker build (no push) —
#     cheap validation, no churn on the running stack.
#   - a version tag (v*, e.g. v0.1.0): lint + test + docker build AND
#     publish to GHCR — the only time what's pullable into the Sonarr
#     compose stack actually changes.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least-privilege default; the docker job elevates just the two scopes
# it needs (see below) only for tag pushes.
permissions:
  contents: read

env:
  # Matches the Dockerfile's base image pin, not the 3.14 local dev
  # happens to run — see Dockerfile's own comment.
  PYTHON_VERSION: "3.12"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only actually used on the publish path below (tag pushes); a
      # push-to-main build doesn't push an image so doesn't need this,
      # but Actions grants permissions per-job, not per-step.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tags=${IMAGE}:${version},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:ci-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and publish only on a v* tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
