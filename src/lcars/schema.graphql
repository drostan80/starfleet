# ---------------------------------------------------------------------------

"reconcileEpisodeMovieLinks's own confirmation summary. matched: a bonus_movie episode resolved to exactly one show_relation-linked movie show, applied immediately (source TMDB_MATCH). flagged: more than one candidate — pending_review (field \"episode_movie_link\"), a human needs to confirm which. unmatched: zero candidates right now — a real, self-healing outcome, not an error. availabilitySynced: a linked episode's availableViaRadarr/filePathRadarr mirrored from its matched movie show (§5.2 — availability.py's own B.3 docstring names this as this mutation's job, not its own)."
