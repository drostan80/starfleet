"""
Result of an amendShowArrLink mutation — reports what happened at
each step so the client can present clear status.
"""
type AmendArrLinkResult {
  "Whether the operation completed successfully end-to-end."
  success: Boolean!
  "What the old external ID was (before amendment)."
  oldExternalId: String
  "The new external ID that was set."
  newExternalId: String!
  "The title Sonarr/Radarr resolved the new ID to."
  resolvedTitle: String
  "Whether the old series/movie was deleted from the arr."
  arrDeleted: Boolean!
  "Whether the correct series/movie was added to the arr."
  arrAdded: Boolean!
  "Human-readable status message with per-step detail."
  message: String!
}

"§5.4 — passive/informational only, never goes through pending_review (unlike show_external_id links)."
