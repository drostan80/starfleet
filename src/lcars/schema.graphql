"""
§5.5 — season-level identity (which AniList/MAL entry this particular
season of a show corresponds to). Replaces ShowIdMapping 2026-08-08
(A.4): one show can span multiple AniList entries, one per season
(TVDB groups a franchise's seasons under one series id; AniList splits
each season into its own entry) — a single anilist_id column on a
show-scoped table couldn't represent that. tvdbId stays on Show via
ShowExternalId, unchanged — TVDB doesn't split by season.
"""
type Season {
  id: ID!
  show: Show!
  seasonNumber: Int!
  "Subdivision within a broadcast season (default 1). When a source splits one broadcast season into parts (e.g. 'Season 3 Part 1' and 'Season 3 Part 2'), each part gets its own season row sharing the same seasonNumber but with partNumber 1 and 2."
  partNumber: Int!
  "Source-provided label for this subdivision (e.g. 'Part 2', 'Wano Country Arc'). Null for unsplit seasons."
  label: String
  anilistId: Int
  malId: Int
  "Per-source names and IDs for this season — each database may name the same subdivision differently."
  externalIds: [SeasonExternalId!]!
  "Per-season status; nullable (null = inherits show.status). Set via setSeasonStatus mutation."
  status: ShowStatus
  "A.9 — this season's own personal score (0-20 quarter-point scale, same as Show.score); nullable, falls back to Show.score for the AniList push when unset (§6.1)."
  score: Float
  "Write-mirror function set, todo.md (2026-08-16) — the watchedAt of this season's first-ever watch_event, captured once (never moves on a later delete/re-mark of that same episode). Null for every season that existed before this field did, and for any season not yet started — see the migration's own docstring for the historical-backfill note."
  startedAt: DateTime
  "Write-mirror function set, todo.md (2026-08-16) — the date show.status transitioned to 'completed', written onto the show's highest-numbered linked season only (show.status is show-wide; this mirrors watch_reconcile.py's own highest-season convention for that asymmetry). Null until then."
  completedAt: DateTime
  "S5 — absolute episode range for this season, from the season-subdivision model (D4/D5). Null for season 0 (specials) and any season whose range hasn't been filled yet (lazy fill on next Sonarr touch, or via the one-time backfill script)."
  absStart: Int
  "S5 — see absStart."
  absEnd: Int
  "Resolved: selected art_asset poster for this season → show's own posterUrl fallback. Null when neither exists."
  posterUrl: String
  "All art assets linked to this season (posters, banners, backgrounds from all sources)."
  artAssets: [ArtAsset!]!
  source: SeasonSource!
  matched: Boolean!
  manualOverride: Boolean!
  lastReconciledAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

"Cross-database identity for a season — each source database's own ID and name for this subdivision."
type SeasonExternalId {
  service: String!
  externalId: String!
  "The source database's own name for this season/entry (e.g. AniList's title, MAL's title). Null when not yet fetched."
  name: String
  url: String
}

type SeasonEdge {
  node: Season!
  cursor: String!
}

type SeasonConnection {
  edges: [SeasonEdge!]!
  pageInfo: PageInfo!
}

