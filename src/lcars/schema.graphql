# ---------------------------------------------------------------------------
# Query
# ---------------------------------------------------------------------------

type Query {
  show(id: ID!): Show
  shows(first: Int, after: String, last: Int, before: String): ShowConnection!
  "§8 — shows by status. A list of statuses (not singular) so e.g. WATCHING+PAUSED can be queried together without becoming generic pass-through filtering."
  showsByStatus(statuses: [ShowStatus!]!, first: Int, after: String, last: Int, before: String): ShowConnection!

  episode(id: ID!): Episode
  "B.17 — a single season by id, added so a generic pending_review consumer (Data's own review screen) can resolve a season-entity review's `entityId` to a real show/season-number label without needing a second, wider query. Mirrors show(id:)/episode(id:) — no equivalent existed before this, since every other season access went through Show.seasons."
  season(id: ID!): Season
  "§8 — episodes airing in the next N days."
  episodesAiringSoon(days: Int!, first: Int, after: String, last: Int, before: String): EpisodeConnection!
  "§8, B.11c — episodes with an air date within [start, end), half-open (matches Data's own calendar_nav.CalendarState.date_range() convention). Unlike episodesAiringSoon (future-only, relative to server 'now'), the caller supplies explicit bounds so a client-side calendar can page arbitrarily into the past or future. Both bounds are plain Z-suffixed UTC strings, same convention every stored timestamp already uses — not reformatted, just validated and compared lexicographically."
  episodesInRange(start: DateTime!, end: DateTime!, first: Int, after: String, last: Int, before: String): EpisodeConnection!
  "§8 — the backlog: unwatched-but-available episodes on watching-status, airing shows (§6.3)."
  backlog(first: Int, after: String, last: Int, before: String): EpisodeConnection!

  "§8 — the pending-review list. Defaults to unresolved only; includeResolved surfaces the permanent record too (§5.6: never purged)."
  pendingReviews(includeResolved: Boolean = false, first: Int, after: String, last: Int, before: String): PendingReviewConnection!

  "§8/§6.5 — full-text search across all title variants and synopses (not just the primary title)."
  search(query: String!, first: Int, after: String, last: Int, before: String): ShowConnection!

  """
  2026-08-18 — Sonarr's/Radarr's own "add new" search (title, not an
  id), read-only: writes nothing anywhere, tracks nothing in LCARS.
  Exists for a client's own disambiguation picker (Data's `A`) *before*
  calling addShowWithArr, not a replacement for it — once the user
  picks one, pass that exact candidate's own tvdbId/tmdbId into
  AddShowWithArrInput to add it, sidestepping addShowWithArr's own
  auto-pick-first-result behavior entirely (already supported, see its
  own docstring). Genuinely empty (not a GraphQL error) when the
  search found nothing, or when the relevant service isn't configured
  for this mediaShape at all — same "not configured = same as not
  linked" every other Sonarr/Radarr touchpoint in this schema already
  has. A real service failure (unreachable, bad api key) does raise.
  """
  searchArrCandidates(mediaShape: MediaShape!, title: String!): [ArrCandidate!]!

  """
  Search AniList's anime catalog by title — returns up to 10 results sorted
  by relevance.  Each result carries the companion MAL ID (idMal) so the
  season mapping editor can fill both IDs from one pick.  Empty list when
  no results found; raises on a real AniList service failure.
  """
  searchAniList(title: String!): [AniListCandidate!]!

  """
  2026-09-02 — look up a show by external-service identity (anilist, tvdb,
  tmdb, imdb, mal). Returns null if no tracked show carries that external
  id. Used by the web client's Add page to pre-mark search candidates as
  "already tracked" before the user triggers addShowWithArr.
  """
  showByExternalId(service: String!, externalId: String!): Show

  """
  Search the local AniDB titles dump by name. Matches across all
  languages (romaji, English, Japanese, etc.). Returns up to 10
  candidates ranked by relevance, each with a verification URL.
  """
  searchAniDb(title: String!): [AniDbCandidate!]!

  """
  Suggest AniDB IDs for a tracked show by matching its titles (romaji,
  English, native, synonyms) plus base-title extraction for sequels.
  Returns candidates with verification URLs. Empty when no match found
  — the client should offer a manual search link.
  """
  suggestAniDbId(showId: ID!): [AniDbCandidate!]!

  "§8/§6.4 — cross-show next-up, across watching-status and paced/catch-up shows, soonest-available-first by default."
  nextUp(first: Int, after: String, last: Int, before: String): NextUpEntryConnection!

  "§6.7/B.1 — watching-status, actively-airing shows not yet metadata-refreshed since the start of today (home_timezone, §6.13). Ops's own daily-pass query; a client's on-open trigger calls this same query, not a separate mutation — whichever caller sees a show here first, refreshShowMetadata (A.8) satisfies it, and the ceiling is naturally 'not stacking' regardless of which fires first."
  dueForMetadataRefresh(first: Int, after: String, last: Int, before: String): ShowConnection!

  "§5.5/B.2 — every season of a watching+actively-airing show (all of that show's seasons, not just the one currently airing) not reconciled against the Fribb dataset in the last 7 days. Ops's own weekly-tier query — self-gating (a season only appears once genuinely stale), so it can be checked as often as convenient without over-reconciling."
  dueForSeasonReconciliation(first: Int, after: String, last: Int, before: String): SeasonConnection!

  "§5.2/§6.7, B.3 — Ops's own adaptive availability-poll cadence, computed server-side: 300 (5 min) while a WATCHING show has an episode that aired in the last 2 hours and isn't yet locally available; 900 (15 min) while one aired further in the past and still isn't available; 3600 (1 hour) baseline otherwise. Radarr has no equivalent urgency — a movie release has no 'just aired' moment."
  recommendedAvailabilityPollIntervalSeconds: Int!

  "§6.7, B.6 — per-integration reachability, distinct from any individual show's tracking state. Always returns exactly one entry per TrackedService, even one never yet contacted (status UNKNOWN) — Data's status bar reads this as per-source indicators, not one aggregate value. No new polling: every entry reflects the outcome of whatever real Sonarr/Radarr/AniList/animeschedule.net call LCARS already made, whether triggered by Ops's automatic cadence or a human's on-demand action."
  serviceHealth: [ServiceHealth!]!

  "Recent grab events from Sonarr or Radarr (2026-08-27). service: 'sonarr' or 'radarr'. page: 1-indexed page number (Sonarr/Radarr native), default 1. pageSize: events per page, default 20. Only 'grabbed' event types are returned — imports, deletes, and rejected grabs are excluded. Returns an empty list (no error) when the requested service is not configured."
  recentGrabs(service: String!, page: Int, pageSize: Int): [GrabEvent!]!

  "Browse anime airing in a specific AniList season. Returns AniList metadata cross-referenced against LCARS's own tracked shows. Anime only; TV/film browse uses browseTmdb."
  browseSeasonalAnime(season: AnimeSeason!, year: Int!, page: Int): SeasonalBrowseResult!

  "Browse TV shows with episodes airing or movies releasing in a given month. mediaType: ALL (default), TV, or MOVIE."
  browseTmdb(year: Int!, month: Int!, mediaType: String, page: Int): TmdbBrowseResult!

  franchise(id: ID!): Franchise
  franchises(first: Int, after: String, last: Int, before: String): FranchiseConnection!

  person(id: ID!): Person
  people(first: Int, after: String, last: Int, before: String): PersonConnection!

  studio(id: ID!): Studio
  studios(first: Int, after: String, last: Int, before: String): StudioConnection!

  tag(id: ID!): Tag
  tags(first: Int, after: String, last: Int, before: String): TagConnection!

  filterPreset(id: ID!): FilterPreset
  filterPresets(first: Int, after: String, last: Int, before: String): FilterPresetConnection!

  "§6.6 — totals, hours watched, personal-score distribution."
  stats: Stats!

  "§6.12 — the full JSON export, schema_version included. Read-only: exporting has no side effect, so this is a query, not a mutation."
  exportData: String!

  "§5.1/§5.2, B.11d — dry-run only, no writes: exactly what backfillUntrackedShows would create right now. Three sources: Sonarr/Radarr's own untracked catalog items (find_untracked_shows_readonly), and an AniList-list sweep (a show tracked on AniList but never added to Sonarr/Radarr at all — the user's own live catch, same day) deduplicated against both Sonarr's full catalog and LCARS's own known AniList links (show-level and per-season). Always run this first."
  previewShowBackfill: [BackfillPreviewItem!]!

  "§5.2, B.11e — the persisted result of the ongoing untracked-show sweep (pollUntrackedShows), refreshed on Ops's own recurring schedule rather than only computed on demand like previewShowBackfill above. A show added directly in Sonarr/AniList after B.11d's one-time backfill shows up here without anyone needing to remember to re-run a manual check."
  untrackedShowFindings(first: Int, after: String, last: Int, before: String): UntrackedShowFindingConnection!

  "B.14 — the reviewable merge log: every cross-service show-duplicate merge pollShowMerges has performed, reversed or not. A Query, so listing it has no side effect — reverseShowMerge is the mutation that acts on an entry."
  showMerges(first: Int, after: String, last: Int, before: String): ShowMergeConnection!
}

# ---------------------------------------------------------------------------
# Mutation
# ---------------------------------------------------------------------------

type Mutation {
  # -- Show lifecycle ---------------------------------------------------
  """
  addShow also triggers A.8's on-demand metadata fetch (poster/
  synopsis/cast/episode-list, plus the show's first `season` row) —
  best-effort: the show is always created regardless of whether the
  fetch succeeds. A fetch failure never raises here; it opens a
  pending_review entry (entity_type SHOW, field "metadata_fetch") and
  leaves the affected fields as they were — retry via
  refreshShowMetadata once whatever was unreachable is back.
  """
  addShow(input: AddShowInput!): Show!
  """
  B.21 — the combined search-Sonarr/Radarr-then-track-in-LCARS flow: one call, given a title
  and/or a known tvdbId/tmdbId, searches the appropriate service (Sonarr for EPISODIC, Radarr for
  MOVIE), creates the entry there if it doesn't already exist (LCARS-configured root
  folder/quality profile — see lcars.ini's sonarr_*/radarr_* defaults, no per-call override yet),
  then runs the same local create-show + on-demand metadata fetch addShow already does. Distinct
  from addShow itself (still available, unchanged, for a show with no Sonarr/Radarr entry at all,
  or one the caller creates separately) — kept as its own mutation rather than extending
  AddShowInput/addShow since addShow's existing Show! return type has a real caller today (Data's
  own bridge) that doesn't need or expect this richer result.

  A title-only call with no tvdbId/tmdbId auto-picks the *first* Sonarr/Radarr search result, no
  human disambiguation step (a single stateless mutation has none) — supply an exact tvdbId/tmdbId
  when it's already known to sidestep this; AddShowResult's matchedTitle/matchedTvdbId/
  matchedTmdbId let a caller verify what was actually matched/created after the fact. Not
  best-effort like addShow's own metadata fetch — a Sonarr/Radarr add failure (or a resolved id
  that turns out to already belong to a different tracked LCARS show) raises and aborts before
  anything is written anywhere, deliberately, to avoid ever leaving an orphaned series/movie behind
  in Sonarr/Radarr with no matching LCARS show.
  """
  addShowWithArr(input: AddShowWithArrInput!): AddShowResult!
  """
  Skip a show from browse — lightweight tombstone meaning "seen, not interested."
  Creates a minimal stub (tracked = false, status = SKIPPED) or marks an existing
  untracked stub as skipped. No metadata fetch, no Sonarr/Radarr add, no AniList/MAL
  push. The show still appears in browse cross-reference so the user doesn't see it
  as "Not in LCARS" again. If the show is already tracked (tracked = true), this is
  a no-op that returns the existing show unchanged — use setStatus instead.
  """
  skipShow(input: AddShowInput!): Show!
  "A.8 — re-runs the same on-demand metadata fetch addShow triggers at creation; the manual-retry half of its best-effort policy."
  refreshShowMetadata(showId: ID!): Show!
  """
  §5.2/§6.7, B.3 — the global availability sweep: polls Sonarr's and
  Radarr's own /history (grab and import events, not a re-check of
  each tracked episode) since the last processed event
  (availability_poll_checkpoint), updating available_via_sonarr/
  available_via_radarr and the matching file_path_* column on whatever
  episodes/shows those events reference. Ops's own daily/weekly/monthly
  mutations (refreshShowMetadata/reconcileSeasonMapping) act on one
  show/season at a time; this one is a single global sweep instead —
  one shared history feed covers every tracked show at once, so there's
  no per-item argument to take.

  A service's very first call (no checkpoint yet) never walks that
  service's full history here — it seeds the checkpoint to "now" and
  returns zero, so Ops's own automatic cadence (§6.7) never blocks
  LCARS's single request-handling thread on an unbounded backfill.
  Real history before that seed moment is only ever processed by an
  explicit backfillFileAvailability call, run deliberately, not by
  Ops's own timer.
  """
  pollFileAvailability: AvailabilityPollResult!
  """
  §5.2/§6.7, B.3 — the one-time, manually-triggered counterpart to
  pollFileAvailability above: walks each configured service's *entire*
  /history from the beginning, ignoring any existing checkpoint,
  rather than only what's new since it. Not part of Ops's own
  automatic loop — deliberately absent from `run_forever`'s own
  scheduling, since a full walk (tens of thousands of records on a
  long-running Sonarr instance) blocks LCARS's single request-handling
  thread for the duration, real seconds-to-minutes, not sub-millisecond
  like everything else this database does. Meant to be run once,
  deliberately, at a moment of the caller's own choosing (`ops
  backfill-availability`) — e.g. right after B.3's own schema lands, or
  any time real availability state is suspected to have drifted.
  Safe to re-run: the underlying event-matching logic is the same
  idempotent apply pollFileAvailability itself uses, just over a wider
  window; existing correct state is simply reapplied, not corrupted.
  """
  backfillFileAvailability: AvailabilityPollResult!
  """
  §5.2/§6.10, B.3b — the local file audit: two passes per configured
  service. A pure-API current-state reconciliation (Sonarr's
  episode?includeEpisodeFile=true / Radarr's own movie?tmdbId=, both
  independent of and a cross-check against pollFileAvailability's own
  /history-based state) corrects availableViaSonarr/availableViaRadarr
  + the matching filePath directly, no filesystem access needed. A
  second pass, needing LCARS's own container to have the same media
  volume mount Sonarr/Radarr already have, walks each *tracked* show's
  own reported folder for files neither service's current record
  accounts for (orphanFiles) and separately lists any Sonarr/Radarr-
  known show LCARS doesn't track at all (untrackedShows) — both
  report-only, never auto-corrected/auto-created. Gracefully skips the
  filesystem pass (not an error) for any show whose reported path
  isn't accessible, e.g. before the volume mount is added. Not part of
  Ops's own automatic loop — deliberately absent from run_forever's
  scheduling, same reasoning as backfillFileAvailability above, run
  via `ops audit-local-files` at a moment of the caller's own choosing.
  """
  auditLocalFiles: LocalFileAuditResult!
  """
  NEXT_UP.md, 2026-08-19 — auditLocalFiles above's current-state
  reconciliation half (episodesCorrected/showsCorrected), scoped to one
  already-tracked show instead of the whole library: user's own ask,
  after the Anna Pigeon auditLocalFiles fix (v0.1.32) landed, for
  fixing one show's stale Sonarr/Radarr path without re-walking every
  other tracked show's folder too. Routed by the show's own mediaShape
  to whichever service actually applies (Sonarr for episodic, Radarr
  for a movie) — a single-record Sonarr `series?tvdbId=`/Radarr
  `movie?tmdbId=` lookup, not the whole-catalog `all_series()`/
  `all_movies()` fetch the whole-library pass needs.

  `orphanFiles`/`untrackedShows` are always empty here — deliberately
  narrower than auditLocalFiles, not a smaller version of the same
  thing: the filesystem orphan walk is skipped entirely for this scope
  (real gap caught in review — it can only ever compare against
  episodes LCARS has already fetched, so a real file for a not-yet-
  fetched episode would be reported as a false-positive orphan;
  tolerable on a whole-library CLI report an operator skims, not on a
  single keypress fired from the exact show being actively inspected),
  and `untrackedShows` never applies to an already-tracked show in the
  first place. Orphan/untracked discovery stays auditLocalFiles' job.

  A no-op, empty result (not an error) if this show has no matching
  Sonarr/Radarr link yet, or that service isn't configured — same
  "report-only, nothing to correct against" posture as an inaccessible
  filesystem mount above. Errors if showId doesn't exist at all. Not
  part of Ops's own automatic loop, same reasoning as auditLocalFiles.
  """
  auditLocalFilesForShow(showId: ID!): LocalFileAuditResult!
  """
  §5.1/§5.2, B.11d — one addShow (with its own inline A.8 metadata
  fetch: episodes, AniList link resolution via Fribb, season
  reconciliation) per untracked item from three sources: Sonarr/Radarr
  (reusing auditLocalFiles' own untrackedShows computation) and an
  AniList-list sweep (a show tracked on AniList but never added to
  Sonarr/Radarr at all — folded in the same day it was found missing,
  live, by the user). The AniList sweep is deduplicated against both
  Sonarr's full catalog and LCARS's own known AniList links (show-
  level and per-season, §5.5) via Fribb, so a split-cour sequel never
  becomes a second, duplicate show. Throttled between anime-classified
  adds to stay inside AniList's rate budget, scaled by season count —
  this can take real minutes on a large library. Also does a one-time
  AniList list-status read per Sonarr/Fribb-resolved anime show
  created (skipped for an AniList-sweep show, which already knows its
  own status from the same call that found it), to seed its initial
  LCARS status (not an ongoing sync — LCARS stays the source of truth
  after this). Never auto-creates on repeat runs beyond what's still
  genuinely untracked (idempotent/resumable). Always call
  previewShowBackfill first. Not part of Ops's own automatic loop, same
  reasoning as auditLocalFiles above — run via `ops backfill-shows` at
  a moment of the caller's own choosing.
  """
  backfillUntrackedShows: ShowBackfillResult!
  """
  §5.2, B.11e — Ops-scheduled, recomputes previewShowBackfill's own
  combined Sonarr/Radarr/AniList-sweep list and reconciles it against
  the persisted untracked_show_finding table: a still-current finding
  gets its title/path/classification/lastSeenAt refreshed, a new one
  gets inserted, and anything no longer present in this sweep's own
  result gets deleted outright (it's tracked now, or genuinely gone —
  either way, not "untracked" anymore). Never calls addShow — that
  decision stays exactly what it was for auditLocalFiles' own
  untrackedShows, only how the findings surface changes.
  """
  pollUntrackedShows: UntrackedShowPollResult!
  """
  §5.0, B.14 — Ops-scheduled (monthly tier, real N×M cost, same
  reasoning pollCatalogServicePresence's own docstring below gives):
  fuzzy-matches every tracked tvdb-only show against every tracked
  anilist-only anime show and opens a pending_review entry per
  candidate pair. Never merges anything itself, never deletes a show —
  see show_merge.py's own module docstring ("Auto-merge retired") for
  why: real false positives (completely unrelated shows fuzzy-matched
  together) were found live before this ever ran against production.
  applyShowMerge below is the human-triggered action that actually
  merges a specific, reviewed-and-confirmed pair.
  """
  pollShowMerges: ShowMergePollResult!
  """
  2026-08-12 — the actual merge, performed only once a human has
  looked at a specific candidate pair (surfaced via a pending_review
  entry pollShowMerges opened) and confirmed it's genuinely the same
  show. AniList-linked show wins — see ShowMerge's own docstring for
  why, and for what "wins" actually means for episode/watch data.
  Resolves the matching pending_review entry as part of the same call.
  Requires RESOLVING_CLIENTS (§5.6) — this is resolving a reviewed
  value discrepancy, same restriction resolvePendingReview has.
  Refuses (GraphQLError) rather than silently orphaning data if the
  winner has already absorbed a different show sharing the same
  external service.
  """
  applyShowMerge(winnerId: ID!, loserId: ID!, matchedOn: String!): ShowMerge!
  """
  §5.0, B.14 — undoes a specific ShowMerge in place: every row the
  original merge reassigned moves back onto the loser, which is then
  re-flipped to tracked = true. Errors (unknown id, already reversed)
  surface as a plain GraphQL error. A human-triggered corrective
  action, so — unlike pollShowMerges above — this requires the
  client header (any client may call it; see resolvers.py's own note
  on why no RESOLVING_CLIENTS-style restriction applies here).
  """
  reverseShowMerge(id: ID!): ShowMerge!
  """
  W3(b) — resolve a franchise_auto_merge pending_review.
  action: "confirm" (merge stands), "redirect" (reverse + re-merge into
  correctParentId as correctSeason), or "reject" (reverse, restore child
  as standalone, optionally correct its TVDB/AniList via correctedTvdbId/
  correctedAnilistId so the collision doesn't recur).
  """
  resolveFranchiseMerge(
    reviewId: ID!
    action: String!
    correctParentId: ID
    correctSeason: Int
    correctedTvdbId: String
    correctedAnilistId: Int
  ): ShowMerge!
  """
  §6.7, B.5 — a global sweep of animeschedule.net's raw (native/Japan
  release) RSS feed, matched by fuzzy title against LCARS's own
  watching+actively-airing anime shows, restricted to those shows'
  currently-airing season(s). A confident single-episode match writes
  air_date_utc/air_date_source = ANIMESCHEDULE — but respects the
  airdate priority chain (airdate_priority.py): skips episodes whose
  existing source outranks animeschedule (manual, syoboi). Revised
  2026-09-08: animeschedule is now backup to Syoboi Calendar.
  Every overwrite still opens/extends a pending_review, per §5.6,
  never silent. An RSS item that title-matches a tracked show but
  resolves to zero or more than one candidate episode row is flagged
  (pending_review, field "animeschedule_episode_match") rather than
  guessed. No per-item argument — one call sweeps the whole feed, same
  "global sweep, not per-show" shape pollFileAvailability already
  established. Rides Ops's own existing hourly tick (no new interval):
  the feed's own rolling window (§10.1, confirmed live) rotates faster
  than a day, so this can't share B.1/B.4's daily due-gated cadence.
  """
  pollAnimeSchedule: AnimeSchedulePollResult!
  """
  S5 — batch-checks every season that has an abs range + AniList link:
  fetches AniList's episode count and opens/extends a pending_review
  row (field "season_subdivision") for each range-width mismatch.
  Skips airing seasons (AniList episodes: null). Idempotent — extends
  an existing open row rather than opening a duplicate, and suppresses
  re-opening when a human has resolved the same mismatch value. Rides
  the same hourly tick as pollAnimeSchedule (no new interval): a ranged
  season count change on AniList between ticks is rare, and the flag is
  for human confirmation anyway — hourly is more than prompt enough.
  No require_client() — same passive reasoning as pollAnimeSchedule.
  """
  pollSeasonSubdivision: SeasonSubdivisionPollResult!
  """
  Score reverse-sync detection (2026-08-27): batch-fetches the viewer's
  full AniList list and compares each entry's score against what LCARS
  would have pushed (round(effective_lcars × 5)).  Flags discrepancies as
  pending_review (field "score", entity_type "season") for human
  confirmation in Data — no score is auto-applied.  MAL score drift is
  not yet covered (no activity-feed equivalent; a future slice).
  No require_client() — same passive/Ops-internal reasoning as
  pollAnimeSchedule/pollSeasonSubdivision.
  """
  pollScoreSync: ScoreSyncPollResult!
  """
  §6.1/§6.8, A.9 — clamps/rounds silently to the 0-20 quarter-point
  scale rather than rejecting out-of-range input. Also pushes to
  AniList (×5, exact) on every season the show has an AniList link
  for, using that season's own `score` when set, else this value —
  best-effort: not yet authenticated (`lcars anilist-login`) or an
  unreachable AniList just skips the push/opens a pending_review
  entry, never blocks the local write.
  """
  setScore(showId: ID!, score: Float!): Show!
  "A.9, §6.1/§5.5 addendum — same push as setScore, scoped to one season and its own AniList entry only."
  setSeasonScore(seasonId: ID!, score: Float!): Season!
  """Per-season status. Updates season.status and recomputes the derived show.status.
  Pass status: null to clear (falls back to show-level status for derivation).
  Setting COMPLETED on a season that's still airing (has unaired or undated episodes)
  requires confirmed: true — same guard as setStatus on the show level."""
  setSeasonStatus(seasonId: ID!, status: ShowStatus, confirmed: Boolean = false): Season!
  "Pins displayTitle to any string (a synonym, a romaji/native title, or a hand-typed one), overriding the write-once primaryTitle default. title: null (or all-whitespace) clears it. Local-only, no AniList/MAL push."
  setDisplayTitle(showId: ID!, title: String): Show!
  """
  Re-fetches AniList's authoritative title{romaji,english,native} for one
  show and writes them back to LCARS — the on-demand counterpart to the
  one-time backfill_titles.py script.  If AniList has an English title,
  overwrites all three title fields and sets primaryTitle='english'.  If
  AniList has no English title, overwrites romaji/native only and leaves
  primaryTitle unchanged.  displayTitleOverride is never touched.
  Raises if the show has no AniList link or AniList doesn't know the id.
  """
  refreshTitlesFromAniList(showId: ID!): Show!
  """
  Write-mirror function set, todo.md (2026-08-16) — pushes AniList's REPEATING status plus
  `repeatCount` (its own `repeat` field) for this one season's AniList entry. LCARS has no local
  rewatch-count column of its own yet (no read-back mirror exists to consume it either) — this is
  purely the push half, callable explicitly any time a caller already knows the count, same
  best-effort policy as setScore/setSeasonScore (no token configured, or an unreachable AniList,
  never blocks — opens a pending_review instead). Does not change season.score or show.status.
  """
  markSeasonRewatch(seasonId: ID!, repeatCount: Int!): Season!
  """
  §6.8, A.9 — also pushes to AniList (MediaListStatus) on every season the show has a link for; same best-effort policy as setScore.
  Auto-sync, todo.md (2026-08-16) — setting status to COMPLETED on a show that's still airing (an episode with no known air date, or one that hasn't aired yet) fails with a GraphQLError unless `confirmed: true` is also passed; a client (Data) should surface that error text as a y/n prompt and retry with confirmed: true on "y". Confirming only unblocks the status change itself — every currently-unwatched-but-aired episode also gets marked watched (never an unaired one, regardless of confirmation).
  """
  setStatus(showId: ID!, status: ShowStatus!, confirmed: Boolean = false): Show!
  setTracked(showId: ID!, tracked: Boolean!): Show!
  """
  2026-08-18 — `trackingSpace` used to be set-once, at creation only, decided purely from
  whatever the Fribb crowd-dataset happened to know at that exact moment (`show_backfill.py`'s
  `_classify_sonarr`) — nothing ever rechecked it later, even once Fribb caught up. Real, live-hit
  gap ("The Frontier Lord Begins with Zero Subjects," a brand-new simulcast backfilled before
  Fribb had it, stuck on TV and silently never linked to AniList at all, fixed by hand with a
  direct DB edit at the time — no mutation existed for this at all). Same shape as setEpisodeKind
  — no history table (§5.7 lists exactly four: status/score/air_date/tracked), a plain field flip.
  Deliberately doesn't re-trigger metadata fetch itself — refreshShowMetadata already does exactly
  that as its own separate call, and reads tracking_space fresh from the row every time, so the two
  compose correctly as two deliberate steps (flip, then refresh) rather than this reaching into
  metadata.py on its own.
  """
  setTrackingSpace(showId: ID!, trackingSpace: TrackingSpace!): Show!

  # -- §6.2 paced/catch-up mode (A.10) ---------------------------------------
  """
  Restricted to completed/non-airing shows (§6.2) — rejects with a
  GraphQLError if this show currently has any episode with no known
  air date, or a future one. `cadenceDays` defaults to 7 ("default
  weekly, editable") when omitted.
  """
  enablePacedMode(showId: ID!, cadenceDays: Int = 7): Show!
  disablePacedMode(showId: ID!): Show!

  # -- §6.11 deletion policy ---------------------------------------------
  "Soft is always the default/first step (§3 principle 3, §6.11) — a status/tracked-flag change, never a row removal."
  softDeleteShow(showId: ID!): Show!
  "Starts the delay period (§6.11) — sets hard_delete_requested_at."
  requestHardDelete(showId: ID!): Show!
  "Reverses requestHardDelete before the delay elapses."
  cancelHardDelete(showId: ID!): Show!
  "Only succeeds once the delay period has elapsed AND retypedTitle matches the show's current display title (§6.11) — the actual purge, cascading to this show's episodes/watch_events/etc."
  confirmHardDelete(showId: ID!, retypedTitle: String!): Boolean!

  # -- 5.3 watch tracking -------------------------------------------------
  "season/episode required for episodic shows, omitted for movies (§5.3 addendum — media_shape = MOVIE has no episode row)."
  addWatchEvent(showId: ID!, season: Int, episode: Int, watchedAt: DateTime, platform: String): WatchEvent!
  "Hard-deletable (§5.3) — the one deliberate exception to soft-delete-by-default."
  deleteWatchEvent(watchEventId: ID!): Boolean!
  markEpisodeSkipped(episodeId: ID!): Episode!
  "Bulk mutation (§5.3) — one watch_event row per episode in the season, single call. Only marks episodes that have actually aired (2026-08-16) — an episode with no known air date, or a future one, is silently skipped, never marked watched. addWatchEvent/markEpisodeRangeWatched keep no such guard (explicit, single/range episode choices, unlike this bulk one)."
  markSeasonWatched(showId: ID!, season: Int!, watchedAt: DateTime): [WatchEvent!]!
  markEpisodeRangeWatched(showId: ID!, season: Int!, fromEpisode: Int!, toEpisode: Int!, watchedAt: DateTime): [WatchEvent!]!

  # -- 5.2 episode field overrides -----------------------------------------
  "Sets air_date_source = MANUAL — airdate_priority.py's chain means this wins over every automatic source (manual > syoboi > animeschedule > anilist > sonarr > anidb > tvmaze)."
  setEpisodeAirDate(episodeId: ID!, airDateUtc: DateTime!): Episode!
  """
  archive/todo.md:1209, closed 2026-08-25 — the other half of "a way to correct a schedule
  discrepancy... wrong episode-number alignment against AniList" (the air-date half is
  setEpisodeAirDate above): corrects which season/episode slot this episode is filed under,
  e.g. what AniList counts as episode 6 got filed under Sonarr's own episode 5. Only `season`/
  `episode` (the display columns everything else reads — the calendar, reconcile_watch_progress's
  own AniList-progress matching, etc.) move; Sonarr's own raw-reported numbering
  (sonarr_season/sonarr_episode) is captured separately and immutably at fetch time precisely so
  a correction survives every future Sonarr sync rather than getting silently reverted (a phantom
  duplicate re-inserted under the original number) the next time Sonarr reports the episode under
  its own unchanged numbering.

  Rejects (does not swap/shift) if the target season/episode slot is already occupied by a
  *different* episode on this show — same "prefer refuse over guess" posture pending_review's own
  matching already leans on; moving the other episode out of the way first is the caller's own
  call to make, not something this mutation infers. A no-op (returns the episode unchanged) if
  season/episode already match the current values. Re-points any existing watch_event rows for
  the old (season, episode) to the new one (the composite FK they're keyed against, §5.3) so watch
  history isn't orphaned by the move. Resolves `seasonEntity` against a `season` row for the new
  season number if one already exists; left unmatched (null), same as Sonarr fetching into a
  not-yet-reconciled season, if none does — no season row is auto-created here.

  Known boundary, not fixed here: if this leaves seasonEntity unmatched after a cross-season
  move, the *next* real Sonarr fetch can re-match it via `_fetch_sonarr`'s own
  `season_id IS NULL` fallback — which resolves against Sonarr's raw-reported season, i.e. the
  *old* one, not this mutation's corrected new one. That silently re-points seasonEntity back
  at the original season on the following sync. Only bites when the target season row didn't
  already exist at call time; create it first (setSeasonMapping) to avoid it.
  """
  setEpisodeNumber(episodeId: ID!, season: Int!, episode: Int!): Episode!
  setEpisodeRuntimeOverride(episodeId: ID!, runtimeMinutes: Int): Episode!

  """
  Manual override of §5.2's `kind`. Sonarr cannot distinguish
  special/ova/bonus_movie — it only files everything non-regular under
  season 0 — so auto-classification (A.25) can honestly go no further
  than `special`, and this is the only way to record the rest. Added
  2026-08-09: `kind` had been read-only across the entire API since
  A.1, so a wrong value could never be corrected at all.
  """
  setEpisodeKind(episodeId: ID!, kind: EpisodeKind!): Episode!

  # -- 5.5 id-mapper manual overrides (§3 principle 6: manual wins once set) --
  """
  Replaces setShowIdMapping 2026-08-08 (A.4). Upserts by (showId,
  seasonNumber) — same upsert-not-require-existing behavior the
  retired mutation had, since no other mutation creates a season row
  first (mirrors episode's own no-addEpisode-mutation situation,
  §5.2 — A.8's future on-demand fetch populates most of these).
  """
  setSeasonMapping(showId: ID!, seasonNumber: Int!, anilistId: Int, malId: Int): Season!
  """
  A.4 — attempts automatic derivation against the Fribb/anime-lists
  dataset (§5.5, one-time/on-demand download, not live polling) for
  this (showId, seasonNumber): looks up the show's tvdb external id,
  resolves a candidate by (tvdbId, seasonNumber), and applies the
  result immediately (§3 principle 1) unless the row already carries
  manualOverride = true, in which case the stored value is left
  untouched and no PendingReview is written (the human already
  decided — confirmed 2026-08-08). A genuine value change on a
  non-override row, or a fresh row with no candidate found at all,
  opens/extends a PendingReview (§5.6); an unchanged re-check does
  not. Upserts the season row same as setSeasonMapping.
  """
  reconcileSeasonMapping(showId: ID!, seasonNumber: Int!): Season!
  """
  Split a season into two at the given episode boundary. Episodes 1..afterEpisode
  stay in the original season; episodes (afterEpisode+1)..last are moved to a new
  season inserted at seasonNumber+1 (renumbered starting from E1). All subsequent
  seasons are shifted up by one to make room.

  Both halves get their abs_start/abs_end ranges recomputed. The new season is
  created with manual_override=1 and the supplied AniList/MAL ids (optional).
  The original season's open season_subdivision pending_review, if any, is
  auto-resolved.

  Does NOT call _reopen_show_if_completed — a split re-partitions already-watched
  episodes, it does not represent a genuinely new season airing.

  Binary split only. For a 3-way split (e.g. Dr. STONE S4), call twice.
  """
  splitSeason(showId: ID!, seasonNumber: Int!, afterEpisode: Int!, newAnilistId: Int, newMalId: Int): SplitSeasonResult!
  setEpisodeNumberingScheme(showId: ID!, scheme: NumberingScheme!): EpisodeNumberingMapping!
  "§5.1/§5.9 addendum — manually confirm/correct which movie show a bonus_movie-kind episode represents."
  setEpisodeMovieLink(episodeId: ID!, movieShowId: ID!): EpisodeMovieLink!

  # -- 5.4 external links ---------------------------------------------------
  "Accepts an offered show_service_presence link (§5.4), or adds a crosswalk entry manually."
  linkShowExternalId(showId: ID!, service: String!, externalId: String!, url: String!): ShowExternalId!
  unlinkShowExternalId(showId: ID!, service: String!): Boolean!

  "Memory Alpha: manually link a show to an AniDB ID."
  linkAniDb(
    showId: ID!
    anidbId: Int!
    "Optional TVDB ID for episode offset mapping."
    tvdbId: String
    "Which TVDB season this AniDB entry maps to."
    defaultTvdbSeason: Int
    "Episode offset within that season (default 0)."
    episodeOffset: Int
  ): Boolean!

  """
  Correct a wrong TVDB/TMDB external ID: validates the new ID against
  Sonarr/Radarr's lookup, deletes the old series/movie from Sonarr/Radarr,
  adds the correct one, and updates the LCARS external-ID link — all in
  one call with clear per-step error reporting.
  `deleteFiles` defaults false — the media files stay on disk.
  """
  amendShowArrLink(
    showId: ID!
    "The service being corrected — 'tvdb' (Sonarr) or 'tmdb' (Radarr)."
    service: String!
    "The correct external ID to replace the wrong one."
    newExternalId: String!
    "Delete media files from disk when removing the old series/movie."
    deleteFiles: Boolean
  ): AmendArrLinkResult!
  """
  A.7 — the caller supplies candidateTitles already fetched from
  `service`'s own catalog (LCARS makes no outbound HTTP calls itself
  in Phase A, §4 — A.8's on-demand fetch is the only external-call
  trigger); LCARS owns the actual matching decision, fuzzy title
  search across every stored title variant against each candidate,
  threshold-gated (§5.4's own resolved algorithm choice). Upserts on
  (showId, service). Passive/informational — never touches
  pending_review, self-heals quietly on the next call (a show present
  last time but absent now, or vice versa, is just an updated fact).
  """
  refreshShowServicePresence(showId: ID!, service: String!, candidateTitles: [String!]!): ShowServicePresence!
  """
  §5.4/§6.7, B.7 — the `local` pseudo-service's own automatic rollup:
  one show at a time, `present` = any episode with `availableLocally`
  true (episodic) or the show's own `availableLocally` (movie) — both
  already-generated columns, B.3, no external dependency at all.
  Global sweep, no per-item argument, same shape pollFileAvailability
  already established. Negligible cost — rides Ops's existing hourly
  tick, unlike pollCatalogServicePresence below.
  """
  pollLocalServicePresence: ServicePresencePollResult!
  """
  §5.4/§6.7, B.7 — Sonarr (episodic shows) + Radarr (movie shows)
  presence, automated: fetches each service's whole catalog and
  fuzzy-matches every tracked show of the matching mediaShape against
  it. Real N×M cost, confirmed with the user — unlike
  pollLocalServicePresence above, this does NOT ride the hourly tick;
  it's an unconditional, no-per-show-due-gating sweep on B.2's own
  existing monthly cadence (no new interval). AniList/MAL presence is
  NOT covered — a real, checked blocker (anilist_client.py has no
  search/catalog endpoint, mal_client.py doesn't exist yet), not a
  silently-skipped design choice.
  """
  pollCatalogServicePresence: ServicePresencePollResult!
  """
  2026-08-18, tvdb_backfill.py — every tracked episodic show with a
  known anilist_id but no tvdb_id yet, resolved via a reverse lookup
  against the same Fribb dataset already downloaded/cached for the
  forward (tvdb->anilist) direction (A.4/B.2) — no new network
  dependency, and load_dataset()'s own on-disk/in-process caching means
  a call here is a cache hit except once every 7 days. Never guesses: a
  show Fribb's own data can't resolve unambiguously (unknown, or
  genuinely split across multiple tvdb_ids) is left alone, retried for
  free on the next pass. No live outbound Sonarr/Radarr call at all
  (unlike pollCatalogServicePresence) — negligible cost, so this rides
  Ops's existing hourly tick rather than the real-N×M-cost monthly one,
  same "no external HTTP call, no reason not to share the cheap tick"
  reasoning reconcileEpisodeMovieLinks already gets. Movies are NOT
  covered — Fribb has no tmdb_id field, and there's no anilist->tmdb
  path in this codebase at all; a real, checked gap, not a
  silently-skipped one.
  """
  backfillTvdbIds: TvdbBackfillResult!

  """
  §5.1/§6.7, B.8b — episode_movie_link's own automatic tmdb_match
  derivation: for every bonus_movie-kind episode without a
  manual_override link, narrows candidates via show_relation (every
  tracked movie show already related to the episode's parent show,
  either direction) rather than a broad fuzzy title match — this field
  auto-applies, unlike pollCatalogServicePresence's own suggestion-only
  presence flag, so a narrower/higher-confidence candidate pool was
  the deliberate choice (confirmed with the user, module docstring has
  the full reasoning). Exactly one candidate applies immediately;
  zero is a real "unmatched" outcome; more than one opens a
  pending_review. Also mirrors a matched link's movie show's own
  availableViaRadarr/filePathRadarr onto the linked episode
  (availabilitySynced) — the gap availability.py's own B.3 docstring
  explicitly leaves for this mutation. No external HTTP call anywhere
  in this sweep (pure internal SQL reconciliation), so it rides Ops's
  existing hourly tick alongside pollLocalServicePresence, not a new
  interval.
  """
  reconcileEpisodeMovieLinks: EpisodeMovieLinkReconcileResult!

  """
  §6.9, B.10 — the proactive weekly-ish MAL refresh-token renewal job.
  Self-gating (an internal 7-day checkpoint, mal_token_refreshed_at,
  same "checkpoint decides" shape pollAnimeSchedule/pollFileAvailability
  already use) — Ops calls this unconditionally every hourly tick, same
  as pollLocalServicePresence/reconcileEpisodeMovieLinks; almost every
  call is a cheap no-op. Not yet authenticated (`lcars mal-login` never
  run) is the same "not configured" no-op every other best-effort
  integration here gets, never a failure.
  """
  refreshMalTokenIfDue: MalTokenRefreshResult!

  """
  B.15, live-caught 2026-08-12 — one-time-triggered (not part of Ops's
  automatic loop, same "on-demand, deliberately run" precedent as
  backfillFileAvailability/auditLocalFiles/backfillUntrackedShows):
  fetches the real AniList list once, then corrects show.status and
  backfills missing watch_event/episode.state wherever LCARS had
  silently diverged from it. AniList wins outright, no pending_review
  gate — see watch_reconcile.py's own module docstring for the full
  scope and reasoning, including why this is deliberately narrower
  than the still-unscheduled general reverse-sync design.
  """
  reconcileWatchProgress: WatchProgressReconcileResult!

  """
  B.5.3, 2026-08-13 — the recurring trigger watch_reconcile.py's own
  module docstring said reconcileWatchProgress above was waiting on:
  polls AniList's own activity feed (one cheap call, watermarked, since
  the last check) and only runs reconcileWatchProgress's own heavier
  full-list sweep when that feed actually shows something new. Not yet
  wired into Ops's automatic loop — deliberately called by hand a few
  times against production first (user's own build-order call,
  2026-08-13) to gather real numbers (activity cadence, whether a
  triggered reconcile ever fires spuriously) before deciding Ops's own
  polling interval and B.5.2's still-unbuilt priority-queue tiers from
  real data instead of a guess.
  """
  pollAnilistActivity: AnilistActivityPollResult!

  "MAL → LCARS reverse sync (2026-08-26): fetch the whole MAL list, reconcile status + episode progress into LCARS (shared hardening with reconcileWatchProgress), then mirror every real change onward to AniList. No activity-feed pre-check (MAL has none), so the whole list is diffed each call — Ops runs it on its own slower loop. Status + progress only; score reverse-sync not built."
  pollMalList: MalReconcileResult!

  """
  Memory Alpha ops loop (2026-09-07): refreshes Anime-Lists XML + AniDB
  titles dump if stale (weekly), re-derives episode mappings on data change,
  seeds AniDB external IDs from Fribb, drip-fetches per-episode data from
  the AniDB HTTP API (5 shows/tick, ~10s), and fills episode.title gaps from
  AniDB English titles. No require_client() — same passive reasoning as
  pollAnimeSchedule; no human-facing write, no changed_by column.
  """
  pollMemoryAlpha: MemoryAlphaPollResult!

  # -- 5.6 pending_review ----------------------------------------------------
  """
  resolvedByClient dropped as an argument 2026-08-08 (A.3) — derived
  from the X-LCARS-Client header instead, same as every other
  mutation's changedBy. Was a redundant/conflicting duplicate of that
  decision, not a separate design.
  """
  resolvePendingReview(id: ID!, resolutionNote: String): PendingReview!

  # -- 5.9 franchise / next-up manual ordering (§3 principle 6) --------------
  setFranchiseMemberOrder(franchiseId: ID!, showId: ID!, sortOrder: Int!): FranchiseEntry!
  setNextUpOrder(showId: ID!, sortOrder: Int!): NextUpOverride!

  # -- 5.1 custom tags ---------------------------------------------------------
  createTag(name: String!): Tag!
  deleteTag(tagId: ID!): Boolean!
  addShowTag(showId: ID!, tagId: ID!): Show!
  removeShowTag(showId: ID!, tagId: ID!): Show!

  # -- 5.10 saved filter presets ------------------------------------------------
  createFilterPreset(name: String!, filterJson: String!): FilterPreset!
  updateFilterPreset(id: ID!, name: String, filterJson: String): FilterPreset!
  deleteFilterPreset(id: ID!): Boolean!

  # -- Art asset selection -------------------------------------------------------
  "Fetch artwork from all available sources (AniList per-season, TVDB) and store in art_asset table. Returns the show with updated artAssets."
  fetchShowArt(showId: ID!): Show!
  "Lazy-fetch episode synopses (and show synopsis if missing) from external sources. Tries TVDB first, falls back to TMDB. Saves to DB for caching."
  fetchEpisodeSynopses(showId: ID!): Show!
  "Select an art asset as the active poster/banner/background for its (show, season, kind) slot. Deselects the previous selection in the same slot."
  selectArtAsset(id: ID!): ArtAsset!
  "Clear the selected art asset for a slot, reverting to the source-data fallback (show.poster_url column)."
  deselectArtAsset(id: ID!): ArtAsset!

  # -- Synopsis editing --------------------------------------------------------
  "Set (overwrite) the show-level synopsis text. Returns the updated show."
  setShowSynopsis(showId: ID!, synopsis: String!): Show!
  "Set (overwrite) an individual episode's synopsis text. Returns the updated episode."
  setEpisodeSynopsis(episodeId: ID!, synopsis: String!): Episode!
  "Fetch synopsis text from all configured external sources WITHOUT saving. Returns candidates for side-by-side comparison. Pass episodeId to get episode-level candidates (TVDB/TMDB only); omit for show-level (AniList/TVDB/TMDB)."
  fetchSynopsisCandidates(showId: ID!, episodeId: ID): [SynopsisCandidate!]!

  # -- 6.12 data import (export is a query — read-only, no side effect) --------
  "Rejects on any schema_version mismatch (§6.12) — a thrown GraphQL error, no auto-migration."
  importData(json: String!): ImportResult!
}

# -- outbound push, "webhook push to clients" design, 2026-08-25 -------------
# GraphQL subscriptions over WebSocket, not a true outbound webhook —
# every client (Data first; `ResolvedByClient`'s `holodeck`/
# `captains_log` name the other two this schema already anticipates)
# connects *out* to LCARS for these, same direction as every other call
# it already makes, rather than LCARS needing to reach a listener on the
# client's own machine. Fire-and-forget, no backlog/replay for a client
# that wasn't connected when the event fired — see lcars/events.py's own
# module docstring for the full "fine to miss" reasoning. A latency
# optimization layered on top of each client's own existing poll/refresh
# path, never the only way state reaches it.
type Subscription {
  """
  Fires once per genuine availableViaSonarr/availableViaRadarr
  transition on an episode (UNAVAILABLE<->DOWNLOADING<->AVAILABLE, any
  direction — availability.py's own _apply_episode_availability(_multi_
  show) only publishes when the new status actually differs from what
  was already stored, so a same-status re-poll/re-webhook is silent
  here, not a redundant fire). The one place both apply_sonarr_webhook/
  apply_radarr_webhook and the ongoing poller funnel through.
  """
  episodeAvailabilityChanged: Episode!
  """
  Fires once a show becomes tracked for the first time — a brand new
  row (addShow/addShowWithArr's own create_show path) or an untracked
  stub getting promoted (_promote_stub, same "genuinely new to the
  client" moment from the outside even though the row already existed).
  The concrete case this whole mechanism was built for: mirroring a
  newly-tracked show into a client's own calendar immediately rather
  than waiting for its next periodic refresh.
  """
  showCreated: Show!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
