  showsUpdated: Int!
}

# ---------------------------------------------------------------------------
# §5.2/§6.10 local file audit (B.3b)
# ---------------------------------------------------------------------------

"A file physically present in a tracked show's own Sonarr/Radarr-reported folder that neither service's own current file record accounts for — auditLocalFiles' own filesystem-reading half (local_audit.py). Report-only: no existing episode/show row to correct, so nothing is written automatically. season/episode are parsed from the filename itself (both of the user's own real Sonarr naming templates always carry S{season}E{episode} somewhere in it) and are null if that parse fails — a parse failure is itself a finding, not silently skipped."
type OrphanFile {
  showId: ID!
  path: String!
  parsedSeason: Int
  parsedEpisode: Int
}

"A show/movie Sonarr or Radarr's own library tracks that has no matching show_external_id crosswalk entry in LCARS at all — auditLocalFiles' other filesystem-adjacent finding. Not auto-created (§5.1's own addShow flow is the only way a show enters LCARS) — listed here for the user to add by hand if they want it tracked. No folder walk happens for these; there's no LCARS row yet to cross-reference against."
type UntrackedRemoteShow {
  service: String!
  title: String!
  externalId: Int!
  path: String
}

"auditLocalFiles' own confirmation summary — same human/Ops-facing-count spirit as AvailabilityPollResult above, not itself the source of truth for what changed."
type LocalFileAuditResult {
  episodesCorrected: Int!
  showsCorrected: Int!
  orphanFiles: [OrphanFile!]!
  untrackedShows: [UntrackedRemoteShow!]!
}

"previewShowBackfill's own per-item shape — B.11d. trackingSpace/mediaShape are the classification backfillUntrackedShows would actually use. Sonarr items: a successful Fribb tvdb->anilist resolution is the anime signal (corrected live, same day, from Sonarr's own seriesType flag — verified unreliable against the user's real library). Radarr items: TV by default, no anime signal exists there. AniList-sweep items: always ANIME, mediaShape from AniList's own format field."
type BackfillPreviewItem {
  service: String!
  title: String!
  externalId: Int!
  trackingSpace: TrackingSpace!
  mediaShape: MediaShape!
}

"backfillUntrackedShows' own per-created-or-promoted-show record — B.11d. Same shape for both ShowBackfillResult fields below."
type BackfilledShow {
  showId: ID!
  service: String!
  title: String!
}

"backfillUntrackedShows' own per-failed-item record — B.11d. Genuinely reachable, not just for-completeness: shows.create_show() now rejects an id match against an already-tracked show outright (a real duplicate-add attempt) rather than silently creating a second row for it — B.11d follow-up, found live."
type FailedBackfillItem {
  service: String!
  title: String!
  error: String!
}

"W3 — a sequel that backfillUntrackedShows auto-attached as a new season on its parent, instead of creating a separate show."
type SequelAttachedItem {
  parentShowId: ID!
  parentTitle: String!
  seasonNumber: Int!
  service: String!
  title: String!
}

"B.11d — backfillUntrackedShows' own confirmation summary. `promoted` split from `created` in the same-day follow-up fix: a candidate whose external id an *earlier* candidate in this same run had already stub-created (via that show's own AniList relations walk, A.21) gets its stub promoted in place (tracked = true, SCOPE.md §5.1's own documented path) instead of a second row — 86 real collision pairs found live before this fix shipped. See show_backfill.py's own module docstring for the full story."
type ShowBackfillResult {
  created: [BackfilledShow!]!
  promoted: [BackfilledShow!]!
  failed: [FailedBackfillItem!]!
  sequelAttached: [SequelAttachedItem!]!
}

"B.11e — one persisted row from the ongoing untracked-show sweep (pollUntrackedShows), same underlying computation previewShowBackfill runs one-shot. Only ever removed by no longer appearing in a fresh sweep (the show got tracked some other way, or genuinely disappeared from its source) — no separate resolve/dismiss action, unlike PendingReview."
type UntrackedShowFinding {
  id: ID!
  service: String!
  title: String!
  externalId: String!
  path: String
  trackingSpace: TrackingSpace!
  mediaShape: MediaShape!
  firstSeenAt: DateTime!
  lastSeenAt: DateTime!
}

type UntrackedShowFindingEdge {
  node: UntrackedShowFinding!
  cursor: String!
}

type UntrackedShowFindingConnection {
  edges: [UntrackedShowFindingEdge!]!
  pageInfo: PageInfo!
}

"pollUntrackedShows' own confirmation summary — same human/Ops-facing-count spirit as every other *PollResult. found is the total current list after this sweep, not just what changed."
type UntrackedShowPollResult {
  found: Int!
  newFindings: Int!
  resolvedFindings: Int!
}

"B.14 — one persisted row from the cross-service show-merge sweep (pollShowMerges): winnerShow is the surviving, canonical show (the AniList-linked one — confirmed with the user, see the B.14 migration's own docstring for why); loserShow is demoted (tracked = false), never deleted, so a merge is always reversible via reverseShowMerge. manifest is a human-readable rendering of exactly what moved and what was left behind on a genuine per-slot conflict — the mechanism reverseShowMerge itself replays is the underlying JSON this flattens, not something a client needs to parse."
type ShowMerge {
  id: ID!
  winnerShow: Show!
  loserShow: Show!
  matchedOn: String!
  manifest: [String!]!
  mergedAt: DateTime!
  reversedAt: DateTime
  reversedByClient: String
}

type ShowMergeEdge {
  node: ShowMerge!
  cursor: String!
}

type ShowMergeConnection {
  edges: [ShowMergeEdge!]!
  pageInfo: PageInfo!
}

"pollShowMerges' own confirmation summary — same human/Ops-facing-count spirit as every other *PollResult. candidatesFound is this pass's fresh recomputation (not cumulative); reviewsOpened is real open-or-extend calls this pass (2026-08-12: this mutation no longer merges anything itself — see show_merge.py's own module docstring for why; applyShowMerge is the human-triggered action that actually merges a reviewed pair)."
type ShowMergePollResult {
  candidatesFound: Int!
  reviewsOpened: Int!
}

