# §6.1/§6.9 MAL integration (B.10)
# ---------------------------------------------------------------------------

"refreshMalTokenIfDue's own confirmation summary. refreshed: true only when a genuine refresh call was actually made and succeeded — false covers every no-op case alike (not configured, not yet due, or a failed attempt this pass) since none of those need distinguishing from Ops's own side (it just retries next hourly tick regardless)."
type MalTokenRefreshResult {
  refreshed: Boolean!
}

# ---------------------------------------------------------------------------
# B.15 — AniList -> LCARS watch reconciliation (live-caught 2026-08-12)
# ---------------------------------------------------------------------------

"reconcileWatchProgress's own confirmation summary. seasonsChecked: LCARS seasons matched to a real AniList list entry this run. notMatchedOnAnilist: a season with an anilist_id LCARS knows about, but no corresponding entry on the real list (removed from AniList, or a stale/wrong id) — a real, if rare, self-healing-not-yet outcome, not an error. showsStatusUpdated / episodesBackfilled: real corrections actually applied — see watch_reconcile.py's own module docstring for exactly what wins on a divergence and why. ambiguousAnilistIdConflicts (2026-08-13 hardening): seasons excluded from this run because more than one season claims the same anilist_id — real, reproduced, doesn't self-heal, each one gets its own pending_review entry rather than a guess."
type WatchProgressReconcileResult {
  seasonsChecked: Int!
  notMatchedOnAnilist: Int!
  showsStatusUpdated: Int!
  episodesBackfilled: Int!
  ambiguousAnilistIdConflicts: Int!
}

"pollMalList's own confirmation summary (2026-08-26, MAL reverse sync) — the MAL-keyed mirror of WatchProgressReconcileResult. Same fields, same meanings, keyed on mal_id instead of anilist_id: seasonsChecked matched to a real MAL list entry; notMatchedOnMal known here but absent from the MAL list; showsStatusUpdated/episodesBackfilled real corrections applied to LCARS (then mirrored onward to AniList); ambiguousMalIdConflicts seasons excluded because more than one claims the same mal_id. Status + progress only — score reverse-sync is not built (NEXT_UP)."
type MalReconcileResult {
  seasonsChecked: Int!
  notMatchedOnMal: Int!
  showsStatusUpdated: Int!
  episodesBackfilled: Int!
  ambiguousMalIdConflicts: Int!
}

"pollAnilistActivity's own confirmation summary — B.5.3. activitiesSeen: how many new AniList activity-feed entries (type ANIME_LIST) existed since the last check, purely a cheap 'did anything change' trigger signal, not itself a source of truth for what changed. reconcileResult: reconcileWatchProgress's own result, populated only when activitiesSeen > 0 (only then does this actually run that heavier sweep) — null on every quiet poll rather than a dict of zeros, so a caller can tell 'nothing new' apart from 'checked and genuinely found nothing to fix' at a glance."
type AnilistActivityPollResult {
  activitiesSeen: Int!
  reconcileResult: WatchProgressReconcileResult
}

"pollMemoryAlpha's own confirmation summary — Memory Alpha ops loop. datasetsRefreshed: true when Anime-Lists XML, AniDB titles dump, Wikidata TV bridge, or ARM were stale and re-downloaded this tick (weekly cadence). seasonRowsCreated/episodeSeasonIdsLinked: missing season rows created from episode.season + NULL episode.season_id backfilled. dripFetched/dripEpisodesStored: AniDB HTTP API calls (anime). tvmazeDripFetched/tvmazeEpisodesStored: TVmaze API calls (TV/movies). syoboiTidsSeeded: Syoboi Calendar TIDs linked via ARM. syoboiProgramsFetched: broadcast events fetched from Syoboi. airdateGapsFilled: episode.air_date_utc nulls filled from AniDB + TVmaze + Syoboi. syoboiAirdatesRewired: existing Sonarr/AniList dates overwritten with Syoboi minute-accurate JST broadcast times."
