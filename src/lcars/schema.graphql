# §6.7 animeschedule.net air-date reconciliation (B.5)
# ---------------------------------------------------------------------------

"pollAnimeSchedule's own confirmation summary — same human/Ops-facing-count spirit as AvailabilityPollResult above. episodesUpdated is a genuine air_date_utc correction/confirmation; flagged is an RSS item that matched one of LCARS's own watching+airing shows by title but couldn't be resolved to exactly one episode row (pending_review, field \"animeschedule_episode_match\") — a human needs to look, not a source of truth about what changed on its own."
