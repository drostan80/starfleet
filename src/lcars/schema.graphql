# ---------------------------------------------------------------------------
# 5.5 id-mapper / reconciliation tables (+ the 2026-08-08 episode_movie_link addendum)
# ---------------------------------------------------------------------------

"""
§5.5 — season-level identity (which AniList/MAL entry this particular
season of a show corresponds to). Replaces ShowIdMapping 2026-08-08
(A.4): one show can span multiple AniList entries, one per season
(TVDB groups a franchise's seasons under one series id; AniList splits
each season into its own entry) — a single anilist_id column on a
show-scoped table couldn't represent that. tvdbId stays on Show via
ShowExternalId, unchanged — TVDB doesn't split by season.
"""
type Season {
  id: ID!
  show: Show!
  seasonNumber: Int!
  anilistId: Int
  malId: Int
  "A.9 — this season's own personal score (0-20 quarter-point scale, same as Show.score); nullable, falls back to Show.score for the AniList push when unset (§6.1)."
  score: Float
  source: SeasonSource!
  matched: Boolean!
  manualOverride: Boolean!
  lastReconciledAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SeasonEdge {
  node: Season!
  cursor: String!
}

type SeasonConnection {
  edges: [SeasonEdge!]!
  pageInfo: PageInfo!
}

type EpisodeNumberingMapping {
  id: ID!
  show: Show!
  scheme: NumberingScheme!
  source: NumberingSource!
  matched: Boolean!
  manualOverride: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"§5.1/§5.9 addendum — reconciles a bonus_movie-kind episode against the standalone movie show for the same film."
type EpisodeMovieLink {
  id: ID!
  episode: Episode!
  movieShow: Show
  source: EpisodeMovieLinkSource!
  matched: Boolean!
  manualOverride: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ---------------------------------------------------------------------------
# 5.6 pending_review
# ---------------------------------------------------------------------------

"""
§5.6 — the shared audit-only reconciliation mechanism. `entityType`/
`source` are plain String (open-ended, §5.6/§5.7). `entityType` +
`entityId` split from a single "entity" column found underspecified
while drafting A.1 (see SCOPE.md §5.6) — needed to say *which* row.
"""
type PendingReview {
  id: ID!
  entityType: String!
  entityId: ID!
  field: String!
  previousValue: String
  "Full sequence of intermediate values since the entry opened, not just the latest (§5.6)."
  proposedValueChain: [String!]!
  source: String!
  createdAt: DateTime!
  resolvedAt: DateTime
  resolvedByClient: ResolvedByClient
  resolutionNote: String
}

type PendingReviewEdge {
  node: PendingReview!
  cursor: String!
}

type PendingReviewConnection {
  edges: [PendingReviewEdge!]!
  pageInfo: PageInfo!
}

