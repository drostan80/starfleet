"pollLocalServicePresence's/pollCatalogServicePresence's own confirmation summary — same human/Ops-facing-count spirit as AvailabilityPollResult, counting only a real change (new row or a present flip), not every show checked."
type ServicePresencePollResult {
  showsUpdated: Int!
}

"backfillTvdbIds's own confirmation summary — same shape as ServicePresencePollResult, counting only a show that actually got a new tvdb_id link written, not every candidate checked."
