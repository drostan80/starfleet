}

# ---------------------------------------------------------------------------
# §6.7 per-integration service-health tracking (B.6)
# ---------------------------------------------------------------------------

"The five services tracked for health — the original four §6.7 names plus MAL (B.10, added once refreshMalTokenIfDue gave it a real outbound call to hook) — deliberately excludes the `local` pseudo-service (§5.4/ShowServicePresence), a SQL aggregate over episode rows, not a reachability concept."
enum TrackedService {
  SONARR
  RADARR
  ANILIST
  ANIMESCHEDULE
  MAL
}

"UNKNOWN is never stored (service_health's own CHECK constraint only allows ok/unreachable) — it's synthesized by the serviceHealth resolver for a service with no row yet (never configured, or just not polled since this table was added), so a caller never has to treat \"missing from the list\" as an implicit fourth state."
enum ServiceHealthStatus {
  OK
  UNREACHABLE
  UNKNOWN
}

"One grab event from Sonarr or Radarr's /history feed (2026-08-27). title: the series or movie title as Sonarr/Radarr knows it. releaseTitle: the release name (Sonarr/Radarr's own sourceTitle — the full filename before download). date: ISO 8601 UTC timestamp of the grab. quality: quality profile name (e.g. 'Bluray-1080p'); null when the quality object is absent in the history record. seasonNumber/episodeNumber: populated for Sonarr, null for Radarr. airDate: episode air date (Sonarr: episode.airDateUtc); null for Radarr or when absent. filePath: local file path for mpv launch — looked up from the LCARS episode table by tvdb/tmdb ID + sonarr numbering; null when the file hasn't been imported yet or the show isn't in LCARS."
type GrabEvent {
  service: String!
  title: String!
  releaseTitle: String!
  date: String!
  quality: String
  seasonNumber: Int
  episodeNumber: Int
  airDate: String
  filePath: String
}

"A synopsis fetched from an external source, for side-by-side comparison."
type SynopsisCandidate {
  "Source name: 'anilist', 'tvdb', or 'tmdb'."
  source: String!
  "Synopsis text (may be null if the source had no synopsis)."
  text: String
}

"Reachability only, not rate-limit awareness — confirmed with the user, 2026-08-09 (B.6): none of the four client modules currently distinguish a 429 from any other error, so a rateLimited field would be a lie today; deliberately deferred, not modeled here."
type ServiceHealth {
  service: TrackedService!
  status: ServiceHealthStatus!
  lastCheckedAt: DateTime
  "Deliberately untouched by a repeat failure — keeps showing \"last known good contact\" through an ongoing outage rather than going null the moment a second failure lands."
  lastSuccessAt: DateTime
  "Null once status flips back to OK — a stale error message from a since-recovered outage isn't useful to keep showing."
  lastErrorMessage: String
}

