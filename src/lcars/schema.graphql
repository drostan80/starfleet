  anidbIdsSeeded: Int!
  episodesMapped: Int!
  idsPropagated: Int!
  seasonRowsCreated: Int!
  episodeSeasonIdsLinked: Int!
  dripFetched: Int!
  dripEpisodesStored: Int!
  titleGapsFilled: Int!
  tvmazeDripFetched: Int!
  tvmazeEpisodesStored: Int!
  syoboiTidsSeeded: Int!
  syoboiProgramsFetched: Int!
  syoboiAirdatesRewired: Int!
  airdateGapsFilled: Int!
  franchiseCollisionsFound: Int!
  franchiseMergesPerformed: Int!
}

"AniDB per-episode data resolved through episode_anidb_mapping → anidb_episode. Null when the episode has no AniDB mapping or when anidb_episode hasn't been fetched yet for that anime."
