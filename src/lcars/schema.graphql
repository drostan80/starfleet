"""
LCARS GraphQL schema — SCOPE.md §8 (API shape), built against the data
model finished in §5 (BUILD_PLAN.md A.1 + its movie-tracking addendum).

Hand-written SDL, schema-first (§11.1) — Ariadne binds resolvers to
this file, the schema is never generated from Python code. Written in
BUILD_PLAN.md A.2; resolvers (raw sqlite3, no ORM, §11.2) are A.3's job
— nothing here has an implementation yet.

Conventions decided while drafting this (not stated in SCOPE.md before
now — each was asked about explicitly rather than assumed):
  - Pagination: Relay-style cursor connections (edges/node/pageInfo),
    applied to *every* list-shaped field with no exceptions, including
    small nested ones (a show's own episode list, cast, tags, ...).
  - Mutations return the mutated/created entity directly. Failures
    surface via GraphQL's standard top-level `errors` array (thrown
    exceptions in resolvers) — no bespoke per-mutation Payload/error
    type. Consistent with §6.1's own "clamp/round silently" stance:
    most invalid input is normalized, not rejected, so there's little
    for a dedicated error-carrying type to report in the first place.
  - §8's own "not generic pass-through filtering" principle (mirrors
    §3 principle 7 for mutations) — every query below is purpose-built
    for one described use case, never a generic `filter: FilterInput`
    kitchen sink.

Scalar/type mapping notes:
  - Every top-level entity's `id` is GraphQL `ID` — already a human-
    readable, type-prefixed string (§5.0), no separate opaque-id
    scheme needed on top of it.
  - `DateTime` (declared below) represents the ISO-8601 UTC TEXT
    timestamps §5's tables all use (ISO-8601 in, ISO-8601 out).
  - Fields SCOPE.md explicitly marks open-ended (`service` on
    show_external_id/show_service_presence, `source`/`changed_by` on
    the history & pending_review tables) are plain `String`, not
    GraphQL enums — using an enum would silently reintroduce the
    "needs a migration to extend" property §5.4 specifically designed
    around.
"""

scalar DateTime

# ---------------------------------------------------------------------------
# Shared Relay plumbing (§ paging convention decided above)
# ---------------------------------------------------------------------------

"""Common to every connection type below — one shared shape, per Relay convention."""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# ---------------------------------------------------------------------------
# Enums — closed value sets only (SCOPE.md §5). Open-ended fields stay String.
# ---------------------------------------------------------------------------

"§5.1 — the three independent identity axes, plus the reused status enum."
enum MediaShape {
  EPISODIC
  MOVIE
}

enum TrackingSpace {
  TV
  ANIME
}

"Reused unchanged for movies (§5.1/§6.10) — no movie-specific simplification."
enum ShowStatus {
  WATCHING
  PLANNED
  PAUSED
  COMPLETED
  DROPPED
  "Lightweight tombstone — seen, not interested. No AniList/MAL equivalent; never pushed to external services."
  SKIPPED
}

enum AnimeSeason {
  WINTER
  SPRING
  SUMMER
  FALL
}

"§5.2 — specials/OVAs/bonus-movie episodes all keep season = 0, distinguished by kind."
enum EpisodeKind {
  REGULAR
  SPECIAL
  OVA
  BONUS_MOVIE
}

"§6.7's priority order (Manual > animeschedule.net > AniList > Sonarr raw) governs which wins, not this enum's ordering."
enum AirDateSource {
  SONARR
  ANILIST
  ANIMESCHEDULE
  MANUAL
  TVMAZE
  ANIDB
  SYOBOI
}

"§5.2 — distinct from watch_event's existence; state=SKIPPED still satisfies show-level completion."
enum EpisodeState {
  UNWATCHED
  WATCHED
  SKIPPED
}

"§5.8 show_person.role_type."
enum PersonRoleType {
  VOICE_ACTOR
  ACTOR
  STAFF
}

"§5.8 show_studio.role_type."
enum StudioRoleType {
  STUDIO
  PUBLISHER
  NETWORK
}

"§5.1 — which title variant is the display default."
enum PrimaryTitle {
  ROMAJI
  ENGLISH
  NATIVE
}

"""
§5.5 season.source — closed because these three are the only ways
this table's row gets populated. Renamed from ShowIdMappingSource
2026-08-08 (A.4) — show_id_mapping itself was retired (one show can
span multiple AniList entries, one per season; see §5.5), replaced by
this per-season table.
"""
enum SeasonSource {
  FRIBB
  MANUAL
  UNMATCHED
}

"§5.5 episode_numbering_mapping.scheme."
enum NumberingScheme {
  ABSOLUTE
  SEASON_EPISODE
}

"§5.5 episode_numbering_mapping.source."
enum NumberingSource {
  SONARR
  ANILIST
  MANUAL
  UNMATCHED
}

"§5.1/§5.9 addendum (2026-08-08) — episode_movie_link.source."
enum EpisodeMovieLinkSource {
  TMDB_MATCH
  MANUAL
  UNMATCHED
}

"§5.2/§5.1, B.3 — episode.available_via_sonarr/available_via_radarr and show.available_via_radarr (movies). Refined from a plain boolean: a file grabbed but not yet imported is a real, distinct state, and a file can go back to UNAVAILABLE (deleted/replaced), not just forward."
enum AvailabilityStatus {
  UNAVAILABLE
  DOWNLOADING
  AVAILABLE
}

"§5.6 — the three clients that can actually resolve a pending_review entry (corrected from an inconsistent 4-value list while drafting A.1, see SCOPE.md §5.6)."
enum ResolvedByClient {
  DATA
  HOLODECK
  CAPTAINS_LOG
}

# ---------------------------------------------------------------------------
# 5.1 show
# ---------------------------------------------------------------------------

type Show {
  id: ID!
  mediaShape: MediaShape!
  trackingSpace: TrackingSpace!

  titleRomaji: String
  titleEnglish: String
  titleNative: String
  primaryTitle: PrimaryTitle!
  "displayTitleOverride when set, else whichever of the three title fields primaryTitle points at."
  displayTitle: String!
  "A manual pin for displayTitle (any title/synonym the user chose, e.g. \"Lamu\"); null means the primaryTitle default is used. Set via setDisplayTitle."
  displayTitleOverride: String
  "AniList Media.synonyms — alternative titles (alt spellings, abbreviations, other-language/fan names), re-synced on every metadata fetch. Empty when none/not-yet-fetched."
  synonyms: [String!]!

  status: ShowStatus!
  tracked: Boolean!
  score: Float
  totalEpisodes: Int
  durationMinutes: Int
  posterUrl: String
  bannerUrl: String
  "Source-provided, unnormalized display strings (§5.1) — distinct from the tags field below."
  genresRaw: [String!]!
  synopsis: String

  "media_shape = MOVIE only — meaningless/always-UNAVAILABLE for episodic shows (§5.1 movie-tracking addendum). Refined bool -> 3-state, B.3."
  availableViaRadarr: AvailabilityStatus!
  "media_shape = MOVIE only — the imported file path once AVAILABLE, added B.3."
  filePathRadarr: String
  availableCheckedAt: DateTime
  availableLocally: Boolean!

  "media_shape = MOVIE only — set once §6.11's delay period has been requested; null otherwise."
  hardDeleteRequestedAt: DateTime

  """
  §6.2, A.10 — non-null means this show is in paced/catch-up mode, this
  many days between synthetic dates; null means it isn't. Restricted to
  completed/non-airing shows only (enablePacedMode enforces this at
  write time) — an airing show never gets fake dates.
  """
  pacedCadenceDays: Int
  """
  §6.2 — the adaptive next-date formula itself: latest watchEvent +
  pacedCadenceDays, recomputed fresh on every query (never stored/
  pre-baked). Null when not in paced mode, or when there's no watch
  event yet to anchor from (a freshly-enabled show with nothing
  watched yet has no artificial delay before its first episode).
  """
  pacedNextDate: DateTime

  "§6.7/B.1 — last time metadata.fetch_and_populate() ran for this show, from any trigger (addShow's own inline fetch, refreshShowMetadata, or Ops's own daily pass). Null if never fetched. The once-per-day ceiling dueForMetadataRefresh reads against."
  metadataLastRefreshedAt: DateTime

  "Count of episodes with at least one watch event."
  watchedEpisodeCount: Int!
  "Count of episodes available locally or via Sonarr/Radarr."
  availableEpisodeCount: Int!

  createdAt: DateTime!
  updatedAt: DateTime!

  episodes(first: Int, after: String, last: Int, before: String): EpisodeConnection!
  watchEvents(first: Int, after: String, last: Int, before: String): WatchEventConnection!
  externalIds(first: Int, after: String, last: Int, before: String): ShowExternalIdConnection!
  servicePresence(first: Int, after: String, last: Int, before: String): ShowServicePresenceConnection!
  cast(first: Int, after: String, last: Int, before: String): CastCreditConnection!
  studioCredits(first: Int, after: String, last: Int, before: String): StudioCreditConnection!
  tags(first: Int, after: String, last: Int, before: String): TagConnection!
  "§5.9 show_relation, either direction, as a plain Show list. The link now carries relation_type internally (batch 4.1, 2026-09-02) but the GraphQL connection is still plain Shows."
  relatedShows(first: Int, after: String, last: Int, before: String): ShowConnection!
  franchiseMemberships(first: Int, after: String, last: Int, before: String): FranchiseEntryConnection!

  statusHistory(first: Int, after: String, last: Int, before: String): StatusChangeConnection!
  scoreHistory(first: Int, after: String, last: Int, before: String): ScoreChangeConnection!
  trackedHistory(first: Int, after: String, last: Int, before: String): TrackedChangeConnection!

  "All art assets for this show (posters, banners, backgrounds from all sources — show-level and season-level)."
  artAssets: [ArtAsset!]!

  "Replaces one show can have multiple AniList entries, one per season (§5.5) — see Season.anilistId/malId, not a show-level field anymore."
  seasons(first: Int, after: String, last: Int, before: String): SeasonConnection!
  "Nullable until A.8's on-demand fetch or A.4's reconciliation seeds it (or the show predates seeding) — §5.5."
  episodeNumberingMapping: EpisodeNumberingMapping
  "media_shape = MOVIE only — §5.9 addendum."
  nextUpOverride: NextUpOverride
  "media_shape = MOVIE only — the reverse direction of Episode.linkedMovieShow: the bonus_movie-kind episode (elsewhere) reconciled to represent this same film, once matched."
  linkedFromEpisode: Episode
}

type ShowEdge {
  node: Show!
  cursor: String!
}

type ShowConnection {
  edges: [ShowEdge!]!
  pageInfo: PageInfo!
}

# ---------------------------------------------------------------------------
# 5.2 episode
# ---------------------------------------------------------------------------

type Episode {
  id: ID!
  show: Show!
  "The raw Sonarr-numbered season (§5.2) — unchanged since A.1. For that season's own cross-service identity (AniList/MAL ids), see seasonEntity below, added 2026-08-08 (A.4)."
  season: Int!
  "Nullable — not every episode has been linked to a season row yet (A.8/A.4's reconciliation populates it)."
  seasonEntity: Season
  episode: Int!
  kind: EpisodeKind!
  "Decimal-capable synthesized numbering (§5.2, e.g. 12.1) — null until sourced or synthesized."
  absoluteNumber: Float
  "The last irreducible direct-Sonarr-read blocker for the Data thin-client swap, closed 2026-08-16 — sourced from Sonarr's own episode.title, go-forward capture only (null on every episode that existed before this field did, until its show's next real Sonarr fetch). No Radarr/movie equivalent — media_shape = MOVIE has no episode row at all, a movie's own title lives on Show."
  title: String
  synopsis: String

  airDateUtc: DateTime
  airDateSource: AirDateSource
  "Kept for diffing/debugging (§5.2) — the raw, uncorrected value Sonarr itself reported."
  airDateRawSonarr: DateTime

  "Refined bool -> 3-state, B.3 — a file grabbed but not yet imported (DOWNLOADING) is real and distinct from either end state."
  availableViaSonarr: AvailabilityStatus!
  "Only ever meaningfully non-UNAVAILABLE for kind = BONUS_MOVIE (§5.2) — regular/special/ova episodes never populate this."
  availableViaRadarr: AvailabilityStatus!
  "The imported file path once AVAILABLE, Sonarr side — added B.3, cleared when the status moves off AVAILABLE."
  filePathSonarr: String
  "Same, Radarr side — only ever meaningfully set for kind = BONUS_MOVIE, same as availableViaRadarr above."
  filePathRadarr: String
  availableLocally: Boolean!
  availableCheckedAt: DateTime

  "Optional override of show.durationMinutes (§5.1/§5.2)."
  runtimeMinutes: Int
  state: EpisodeState!

  createdAt: DateTime!
  updatedAt: DateTime!

  watchEvents(first: Int, after: String, last: Int, before: String): WatchEventConnection!
  airDateHistory(first: Int, after: String, last: Int, before: String): AirDateChangeConnection!
  "kind = BONUS_MOVIE only — §5.1/§5.9 addendum, the standalone movie show representing the same film, once reconciled."
  linkedMovieShow: Show

  "Memory Alpha — AniDB episode data resolved through the mapping table. Null when unmapped or when per-episode data hasn't been fetched yet."
  anidbMapping: AnidbEpisodeMapping

  "Cross-database identity: this episode's coordinates in each source database (AniList, MAL, AniDB, TVDB, etc). Each entry carries that database's own season/episode numbering."
  externalIds: [EpisodeExternalId!]!
}

"Cross-database identity for an episode — each source database's own numbering for this episode."
type EpisodeExternalId {
  service: String!
  externalId: String!
  "The source database's season number for this episode (may differ from LCARS's own season number)."
  seasonNumber: Int
  "The source database's episode number within its own season."
  episodeNumber: Int
}

type EpisodeEdge {
  node: Episode!
  cursor: String!
}

type EpisodeConnection {
  edges: [EpisodeEdge!]!
  pageInfo: PageInfo!
}

