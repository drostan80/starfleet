  episodesUpdated: Int!
  flagged: Int!
}

"pollSeasonSubdivision's own confirmation summary (S5, 2026-08-27). checked: seasons with a fully-aired AniList entry whose range width was actually compared (airing seasons — null episodes — are excluded). flagged: seasons where range width ≠ AniList episode count and a pending_review row was opened or extended (field \"season_subdivision\"); zero on a quiet tick."
type SeasonSubdivisionPollResult {
  checked: Int!
  flagged: Int!
}

"Result of splitSeason — both halves of the split."
